<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Library — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<style>
  :root {
    --bg: #05050a; --card-bg: #0f0f1a; --border: #1c1c2e;
    --accent-blue: #4f6ef7; --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc; --text-muted: #6b6b80; --input-bg: #0a0a12;
    --af-yellow: #f5c518; --success: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }

  .top-header { display: flex; align-items: center; gap: 14px; padding: 18px 16px; position: sticky; top: 0; background: rgba(5,5,10,0.9); backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid var(--border); }
  .back-btn { font-size: 20px; color: var(--text-light); text-decoration: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 10px; }
  .header-title { font-size: 16px; font-weight: 700; }

  .main-content { padding: 20px 16px; max-width: 560px; margin: 0 auto; }
  .intro { margin-bottom: 20px; }
  .intro h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .intro p { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

  .item-grid { display: flex; flex-direction: column; gap: 12px; }
  .item-card { padding: 14px; border-radius: 16px; background: var(--card-bg); border: 1px solid var(--border); }
  .item-main { display: flex; gap: 14px; }
  .item-cover { width: 64px; height: 84px; border-radius: 10px; background: var(--input-bg); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .item-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .item-category { font-size: 10.5px; font-weight: 700; color: var(--af-yellow); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
  .item-title { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .item-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .download-btn { padding: 9px 18px; border-radius: 10px; background: var(--gradient); color: white; font-weight: 700; font-size: 13px; border: none; cursor: pointer; }
  .download-btn:disabled { opacity: 0.6; }
  .review-btn { padding: 9px 16px; border-radius: 10px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text-light); font-weight: 700; font-size: 13px; cursor: pointer; }

  .your-review { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .your-review-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .your-stars { color: var(--af-yellow); font-size: 14px; letter-spacing: 1px; margin-bottom: 5px; }
  .your-comment { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

  .empty-state { text-align: center; padding: 70px 24px; }
  .empty-state .icon { font-size: 40px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state h2 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .empty-state p { font-size: 13.5px; color: var(--text-muted); line-height: 1.55; margin-bottom: 22px; }
  .empty-state a { display: inline-block; padding: 12px 26px; border-radius: 12px; background: var(--gradient); color: white; text-decoration: none; font-weight: 700; font-size: 14px; }

  .loading-text { text-align: center; color: var(--text-muted); padding: 50px; font-size: 14px; }
  .retry-btn { display: inline-block; margin-top: 16px; padding: 11px 24px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-light); font-weight: 700; font-size: 13.5px; cursor: pointer; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--card-bg); border: 1px solid var(--border); color: var(--text-light); padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 200; max-width: 90%; text-align: center; line-height: 1.4; }
  .toast.show { opacity: 1; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: flex-end; justify-content: center; z-index: 150; }
  .modal-overlay.active { display: flex; }
  .modal-sheet { background: var(--card-bg); border: 1px solid var(--border); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 26px 20px calc(26px + env(safe-area-inset-bottom)); width: 100%; max-width: 560px; }
  .modal-sheet h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; text-align: center; }
  .modal-sheet .modal-sub { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }

  .star-picker { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
  .star-btn { background: none; border: none; font-size: 32px; color: var(--border); cursor: pointer; padding: 0; line-height: 1; }
  .star-btn.filled { color: var(--af-yellow); }

  .modal-sheet textarea { width: 100%; padding: 12px 14px; background: var(--input-bg); border: 1.5px solid var(--border); border-radius: 12px; color: var(--text-light); font-size: 14px; font-family: inherit; resize: vertical; min-height: 90px; outline: none; margin-bottom: 8px; }
  .modal-sheet textarea:focus { border-color: var(--accent-blue); }
  .char-count { font-size: 11.5px; color: var(--text-muted); text-align: right; margin-bottom: 16px; }
  .modal-sheet button.primary { width: 100%; padding: 13px; border-radius: 12px; background: var(--gradient); color: white; font-weight: 700; font-size: 14.5px; border: none; }
  .modal-sheet button.primary:disabled { opacity: 0.6; }
  .modal-sheet a.secondary-link { display: block; margin-top: 12px; color: var(--text-muted); font-size: 13px; text-decoration: none; text-align: center; }
  .modal-error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #f87171; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; margin-bottom: 14px; display: none; }
</style>
</head>
<body>

<div class="top-header">
  <a href="dashboard.html" class="back-btn">←</a>
  <div class="header-title">My Library</div>
</div>

<div class="main-content" id="mainContent">
  <div class="loading-text">Loading your library...</div>
</div>

<div class="modal-overlay" id="reviewModal">
  <div class="modal-sheet" id="reviewModalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');

  if (!token) {
    localStorage.setItem('af_redirect_after_login', window.location.href);
    window.location.href = 'login.html';
  }

  let selectedRating = 0;
  let reviewingProductId = null;
  let editingReviewId = null;

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function starsDisplay(rating) {
    const r = Math.round(Number(rating) || 0);
    return '★'.repeat(r) + '☆'.repeat(5 - r);
  }

  async function handleDownload(productId, btn) {
    btn.disabled = true;
    btn.textContent = 'Preparing...';

    try {
      const res = await fetch(`${API_BASE}/products/${productId}/download`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      const data = await res.json();
      btn.disabled = false;
      btn.textContent = 'Download';

      if (res.status === 403) {
        showToast("You don't have access to this product.");
        return;
      }
      if (!res.ok) {
        showToast(data.error || 'Could not prepare your download. Please try again.');
        return;
      }

      window.location.href = data.url;

    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Download';
      showToast('Connection error. Please try again.');
    }
  }

  function setRating(n) {
    selectedRating = n;
    for (let i = 1; i <= 5; i++) {
      const el = document.getElementById('star' + i);
      if (el) el.classList.toggle('filled', i <= n);
    }
  }

  function openReviewModal(productId, title, existing) {
    reviewingProductId = productId;
    editingReviewId = existing ? existing.id : null;
    selectedRating = existing ? Number(existing.rating) : 0;

    document.getElementById('reviewModalContent').innerHTML = `
      <h3>${existing ? 'Edit your review' : 'Write a review'}</h3>
      <div class="modal-sub">${escapeHtml(title)}</div>

      <div class="modal-error" id="reviewError"></div>

      <div class="star-picker">
        ${[1,2,3,4,5].map(i => `<button class="star-btn" id="star${i}" onclick="setRating(${i})">★</button>`).join('')}
      </div>

      <textarea id="reviewComment" maxlength="2000" placeholder="What did you think of it? (optional)">${existing && existing.comment ? escapeHtml(existing.comment) : ''}</textarea>
      <div class="char-count" id="charCount">0 / 2000</div>

      <button class="primary" id="submitReviewBtn" onclick="submitReview()">${existing ? 'Save Changes' : 'Post Review'}</button>
      <a href="#" class="secondary-link" onclick="closeReviewModal();return false;">Cancel</a>
    `;

    setRating(selectedRating);

    const textarea = document.getElementById('reviewComment');
    const counter = document.getElementById('charCount');
    counter.textContent = `${textarea.value.length} / 2000`;
    textarea.addEventListener('input', () => {
      counter.textContent = `${textarea.value.length} / 2000`;
    });

    document.getElementById('reviewModal').classList.add('active');
  }

  function closeReviewModal() {
    document.getElementById('reviewModal').classList.remove('active');
    reviewingProductId = null;
    editingReviewId = null;
    selectedRating = 0;
  }

  function showReviewError(msg) {
    const box = document.getElementById('reviewError');
    box.textContent = msg;
    box.style.display = 'block';
  }

  async function submitReview() {
    if (selectedRating < 1) {
      showReviewError('Please choose a rating from 1 to 5 stars.');
      return;
    }

    const btn = document.getElementById('submitReviewBtn');
    const comment = document.getElementById('reviewComment').value.trim();
    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      const url = editingReviewId
        ? `${API_BASE}/product-reviews/${editingReviewId}`
        : `${API_BASE}/product-reviews`;

      const method = editingReviewId ? 'PUT' : 'POST';
      const body = editingReviewId
        ? { rating: selectedRating, comment }
        : { product_id: reviewingProductId, rating: selectedRating, comment };

      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify(body)
      });

      const data = await res.json();

      if (!res.ok) {
        btn.disabled = false;
        btn.textContent = editingReviewId ? 'Save Changes' : 'Post Review';
        showReviewError(data.error || 'Could not save your review.');
        return;
      }

      closeReviewModal();
      showToast('Thank you for your review.');
      loadLibrary();

    } catch (err) {
      btn.disabled = false;
      btn.textContent = editingReviewId ? 'Save Changes' : 'Post Review';
      showReviewError('Connection error. Please try again.');
    }
  }

  async function getReviewState(productId) {
    try {
      const res = await fetch(`${API_BASE}/product-reviews/eligibility/${productId}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) return null;
      return await res.json();
    } catch (err) {
      return null;
    }
  }

  async function loadLibrary() {
    try {
      const res = await fetch(`${API_BASE}/library`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (res.status === 401) {
        localStorage.setItem('af_redirect_after_login', window.location.href);
        window.location.href = 'login.html';
        return;
      }

      if (!res.ok) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <h2>Couldn't load your library</h2>
            <p>Something went wrong on our side. Please try again.</p>
            <button class="retry-btn" onclick="loadLibrary()">Try Again</button>
          </div>
        `;
        return;
      }

      const data = await res.json();
      const items = data.items || [];

      if (items.length === 0) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="icon">📚</div>
            <h2>Your library is empty</h2>
            <p>Anything you buy from the Shop will appear here, ready to download whenever you need it.</p>
            <a href="shop.html">Browse the Shop</a>
          </div>
        `;
        return;
      }

      // Fetch review state for each owned item
      const states = await Promise.all(items.map(i => getReviewState(i.product_id)));

      document.getElementById('mainContent').innerHTML = `
        <div class="intro">
          <h1>My Library</h1>
          <p>${items.length} item${items.length === 1 ? '' : 's'} you own.</p>
        </div>
        <div class="item-grid">
          ${items.map((item, idx) => {
            const state = states[idx];
            const existing = state && state.existing_review ? state.existing_review : null;
            const canReview = state && state.can_review;

            let reviewBtn = '';
            if (canReview) {
              reviewBtn = `<button class="review-btn" onclick="openReviewModal(${item.product_id}, '${escapeHtml(item.title).replace(/'/g, "\\'")}', null)">Write a review</button>`;
            } else if (existing) {
              reviewBtn = `<button class="review-btn" onclick='openReviewModal(${item.product_id}, ${JSON.stringify(item.title)}, ${JSON.stringify(existing)})'>Edit review</button>`;
            }

            return `
              <div class="item-card">
                <div class="item-main">
                  <div class="item-cover">
                    ${item.cover_url ? `<img src="${escapeHtml(item.cover_url)}" alt="" onerror="this.remove()">` : ''}
                  </div>
                  <div class="item-info">
                    <div class="item-category">${escapeHtml(item.category || '')}</div>
                    <div class="item-title">${escapeHtml(item.title)}</div>
                    <div class="item-meta">Owned since ${formatDate(item.owned_since)}</div>
                    <div class="btn-row">
                      <button class="download-btn" onclick="handleDownload(${item.product_id}, this)">Download</button>
                      ${reviewBtn}
                    </div>
                  </div>
                </div>
                ${existing ? `
                  <div class="your-review">
                    <div class="your-review-label">Your review</div>
                    <div class="your-stars">${starsDisplay(existing.rating)}</div>
                    ${existing.comment ? `<div class="your-comment">${escapeHtml(existing.comment)}</div>` : ''}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;

    } catch (err) {
      document.getElementById('mainContent').innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <h2>Connection problem</h2>
          <p>Please check your connection and try again.</p>
          <button class="retry-btn" onclick="loadLibrary()">Try Again</button>
        </div>
      `;
    }
  }

  loadLibrary();
</script>

</body>
  </html>
