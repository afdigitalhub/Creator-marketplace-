<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<style>
  :root {
    --bg: #05050a; --card-bg: #0f0f1a; --border: #1c1c2e;
    --accent-blue: #4f6ef7; --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc; --text-muted: #6b6b80; --input-bg: #0a0a12;
    --af-yellow: #f5c518; --success: #34d399; --error: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }

  .top-header { display: flex; align-items: center; gap: 14px; padding: 18px 16px; position: sticky; top: 0; background: rgba(5,5,10,0.9); backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid var(--border); }
  .back-btn { font-size: 20px; color: var(--text-light); text-decoration: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 10px; }
  .header-title { font-size: 16px; font-weight: 700; }

  .main-content { padding: 20px 16px; max-width: 560px; margin: 0 auto; }

  .balance-card { background: linear-gradient(135deg, rgba(79,110,247,0.14), rgba(124,58,237,0.14)); border: 1px solid rgba(139,92,246,0.2); border-radius: 20px; padding: 22px; margin-bottom: 20px; text-align: center; }
  .balance-label { font-size: 12.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .balance-value { font-size: 32px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
  .balance-note { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }

  .form-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 20px; }
  .form-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.04em; }
  input, select { width: 100%; padding: 13px 15px; background: var(--input-bg); border: 1.5px solid var(--border); border-radius: 13px; color: var(--text-light); font-size: 14.5px; outline: none; font-family: inherit; }
  input:focus, select:focus { border-color: var(--accent-blue); }
  select { -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236b6b80' stroke-width='1.5' fill='none'/></svg>"); background-repeat: no-repeat; background-position: right 14px center; }
  .hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; line-height: 1.45; }
  .submit-btn { width: 100%; padding: 15px; border: none; border-radius: 14px; background: var(--gradient); color: white; font-size: 15.5px; font-weight: 700; cursor: pointer; margin-top: 6px; }
  .submit-btn:disabled { opacity: 0.5; }

  .msg-box { padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; line-height: 1.45; }
  .msg-box.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--error); }
  .msg-box.success { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); color: var(--success); }

  .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; margin-top: 8px; }

  .w-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 15px; margin-bottom: 10px; }
  .w-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
  .w-amount { font-size: 16px; font-weight: 800; }
  .status-pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .status-requested { background: rgba(245,197,24,0.12); color: var(--af-yellow); }
  .status-processing { background: rgba(79,110,247,0.14); color: var(--accent-blue); }
  .status-completed { background: rgba(52,211,153,0.12); color: var(--success); }
  .status-failed { background: rgba(248,113,113,0.12); color: var(--error); }
  .w-meta { font-size: 12.5px; color: var(--text-muted); line-height: 1.55; }
  .w-failure { font-size: 12.5px; color: var(--error); margin-top: 6px; line-height: 1.45; }

  .info-box { background: var(--input-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; font-size: 12.5px; color: var(--text-muted); line-height: 1.6; margin-top: 18px; }

  .empty-note { color: var(--text-muted); font-size: 13.5px; line-height: 1.55; padding: 16px 0; }
  .loading-text { text-align: center; color: var(--text-muted); padding: 50px; font-size: 14px; }
  .retry-btn { margin-top: 16px; padding: 11px 24px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-light); font-weight: 700; font-size: 13.5px; cursor: pointer; }
</style>
</head>
<body>

<div class="top-header">
  <a href="earnings.html" class="back-btn">←</a>
  <div class="header-title">Withdraw</div>
</div>

<div class="main-content" id="mainContent">
  <div class="loading-text">Loading...</div>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');

  if (!token) {
    localStorage.setItem('af_redirect_after_login', window.location.href);
    window.location.href = 'login.html';
  }

  const CURRENCY_SYMBOLS = { USD: '$', GHS: '₵', NGN: '₦', GBP: '£', EUR: '€', KES: 'KSh', ZAR: 'R', CAD: '$' };
  function money(amount, currency) {
    const symbol = CURRENCY_SYMBOLS[currency] || '';
    return `${symbol}${Number(amount || 0).toFixed(2)}`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function statusInfo(status) {
    if (status === 'requested') return { label: 'Awaiting review', cls: 'status-requested' };
    if (status === 'processing') return { label: 'Being sent', cls: 'status-processing' };
    if (status === 'completed') return { label: 'Sent', cls: 'status-completed' };
    if (status === 'failed') return { label: 'Failed', cls: 'status-failed' };
    return { label: status, cls: 'status-requested' };
  }

  function showMsg(text, isError) {
    const box = document.getElementById('msgBox');
    if (!box) return;
    box.textContent = text;
    box.className = 'msg-box ' + (isError ? 'error' : 'success');
    box.style.display = 'block';
  }

  async function submitWithdrawal() {
    const btn = document.getElementById('submitBtn');
    const amount = document.getElementById('amount').value;
    const destination_type = document.getElementById('destinationType').value;
    const account_name = document.getElementById('accountName').value.trim();
    const account_number = document.getElementById('accountNumber').value.trim();
    const provider_name = document.getElementById('providerName').value.trim();

    if (!amount || !account_name || !account_number) {
      showMsg('Please fill in every field.', true);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
      const res = await fetch(`${API_BASE}/withdrawals`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ amount: Number(amount), destination_type, account_name, account_number, provider_name })
      });

      const data = await res.json();

      if (!res.ok) {
        btn.disabled = false;
        btn.textContent = 'Request Withdrawal';
        showMsg(data.error || 'Could not submit your request.', true);
        return;
      }

      showMsg('Withdrawal requested. You will be notified once it has been sent.', false);
      setTimeout(load, 900);

    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Request Withdrawal';
      showMsg('Connection error. Please try again.', true);
    }
  }

  async function load() {
    try {
      const res = await fetch(`${API_BASE}/withdrawals/mine`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (res.status === 401) {
        localStorage.setItem('af_redirect_after_login', window.location.href);
        window.location.href = 'login.html';
        return;
      }

      if (!res.ok) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-note" style="text-align:center;">
            Couldn't load your withdrawals.<br>
            <button class="retry-btn" onclick="load()">Try Again</button>
          </div>`;
        return;
      }

      const data = await res.json();
      const cur = data.currency;
      const available = Number(data.available_balance);
      const min = Number(data.minimum_withdrawal);
      const list = data.withdrawals || [];

      const hasInProgress = list.some(w => ['requested', 'processing'].includes(w.status));
      const canRequest = available >= min && !hasInProgress;

      let formSection = '';

      if (hasInProgress) {
        formSection = `
          <div class="form-card">
            <div class="form-title">Request a withdrawal</div>
            <div class="empty-note">You have a withdrawal in progress. You can make another request once it has been completed.</div>
          </div>`;
      } else if (available < min) {
        formSection = `
          <div class="form-card">
            <div class="form-title">Request a withdrawal</div>
            <div class="empty-note">
              You need at least ${money(min, cur)} available to make a withdrawal.
              ${available > 0 ? `You currently have ${money(available, cur)}.` : ''}
            </div>
          </div>`;
      } else {
        formSection = `
          <div class="form-card">
            <div class="form-title">Request a withdrawal</div>
            <div class="msg-box" id="msgBox"></div>

            <div class="field">
              <label>Amount</label>
              <input type="number" id="amount" min="${min}" max="${available}" step="0.01" placeholder="${min}">
              <div class="hint">Minimum ${money(min, cur)}. You have ${money(available, cur)} available.</div>
            </div>

            <div class="field">
              <label>Send to</label>
              <select id="destinationType" onchange="updateProviderLabel()">
                <option value="mobile_money">Mobile Money</option>
                <option value="bank">Bank Account</option>
              </select>
            </div>

            <div class="field">
              <label id="providerLabel">Network</label>
              <input type="text" id="providerName" placeholder="e.g. MTN">
            </div>

            <div class="field">
              <label>Account name</label>
              <input type="text" id="accountName" placeholder="The name on the account">
            </div>

            <div class="field">
              <label id="numberLabel">Mobile money number</label>
              <input type="text" id="accountNumber" placeholder="">
            </div>

            <button class="submit-btn" id="submitBtn" onclick="submitWithdrawal()">Request Withdrawal</button>
          </div>`;
      }

      document.getElementById('mainContent').innerHTML = `
        <div class="balance-card">
          <div class="balance-label">Available to withdraw</div>
          <div class="balance-value">${money(available, cur)}</div>
          <div class="balance-note">This is what has cleared and is ready to be sent to you.</div>
        </div>

        ${formSection}

        <div class="section-title">Your withdrawals</div>
        ${list.length === 0
          ? `<div class="empty-note">You have not requested any withdrawals yet.</div>`
          : list.map(w => {
              const s = statusInfo(w.status);
              const dest = w.destination_details || {};
              return `
                <div class="w-card">
                  <div class="w-top">
                    <div class="w-amount">${money(w.amount, w.currency)}</div>
                    <div class="status-pill ${s.cls}">${s.label}</div>
                  </div>
                  <div class="w-meta">
                    Requested ${formatDate(w.requested_at)}<br>
                    ${w.destination_type === 'mobile_money' ? 'Mobile Money' : 'Bank'}
                    ${dest.provider_name ? ` · ${escapeHtml(dest.provider_name)}` : ''}
                    ${dest.account_number ? ` · ${escapeHtml(dest.account_number)}` : ''}
                    ${w.completed_at ? `<br>Completed ${formatDate(w.completed_at)}` : ''}
                  </div>
                  ${w.failure_reason ? `<div class="w-failure">Reason: ${escapeHtml(w.failure_reason)}</div>` : ''}
                </div>`;
            }).join('')}

        <div class="info-box">
          Withdrawals are reviewed and sent manually. This usually takes a few working days. Your available balance is reduced when you make a request, and returned in full if a withdrawal fails.
        </div>
      `;

      if (canRequest) updateProviderLabel();

    } catch (err) {
      document.getElementById('mainContent').innerHTML = `
        <div class="empty-note" style="text-align:center;">
          Connection problem.<br>
          <button class="retry-btn" onclick="load()">Try Again</button>
        </div>`;
    }
  }

  function updateProviderLabel() {
    const type = document.getElementById('destinationType');
    if (!type) return;
    const isMomo = type.value === 'mobile_money';
    document.getElementById('providerLabel').textContent = isMomo ? 'Network' : 'Bank name';
    document.getElementById('providerName').placeholder = isMomo ? 'e.g. MTN' : 'e.g. GCB Bank';
    document.getElementById('numberLabel').textContent = isMomo ? 'Mobile money number' : 'Account number';
  }

  load();
</script>

</body>
  </html>
