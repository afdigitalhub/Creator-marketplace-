<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdrawals — Founder Command Center</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">

<style>
:root{
  --bg:#05050a;
  --card:#0d0e17;
  --card2:#11121d;
  --border:#202234;
  --text:#f7f8fc;
  --muted:#8b8fa5;
  --gold:#f5c518;
  --blue:#4f6ef7;
  --purple:#7c3aed;
  --green:#34d399;
  --red:#f87171;
  --orange:#f59e0b;
  --gradient:linear-gradient(135deg,#4f6ef7,#7c3aed);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:
    radial-gradient(circle at top right,rgba(79,110,247,.12),transparent 35%),
    radial-gradient(circle at top left,rgba(124,58,237,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  padding-bottom:50px;
}

.top-header{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:13px;
  padding:15px 16px;
  background:rgba(5,5,10,.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}

.back-btn{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:var(--card);
  border:1px solid var(--border);
  color:white;
  text-decoration:none;
  font-size:20px;
}

.header-title{
  font-size:17px;
  font-weight:800;
}

.header-subtitle{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.main{
  max-width:760px;
  margin:auto;
  padding:18px 15px 40px;
}

/* WINDOW */

.window-card{
  background:linear-gradient(135deg,rgba(79,110,247,.12),rgba(124,58,237,.08));
  border:1px solid rgba(79,110,247,.25);
  border-radius:18px;
  padding:17px;
  margin-bottom:18px;
}

.window-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.window-title{
  font-size:15px;
  font-weight:800;
}

.window-text{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
  line-height:1.45;
}

.window-status{
  padding:7px 11px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.window-open{
  background:rgba(52,211,153,.12);
  color:var(--green);
  border:1px solid rgba(52,211,153,.25);
}

.window-closed{
  background:rgba(245,197,24,.10);
  color:var(--gold);
  border:1px solid rgba(245,197,24,.22);
}

/* SUMMARY */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:18px;
}

.summary-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
}

.summary-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:7px;
}

.summary-value{
  font-size:21px;
  font-weight:850;
}

.summary-value.gold{
  color:var(--gold);
}

.summary-value.green{
  color:var(--green);
}

/* FILTER */

.filter-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:15px;
}

.filter-btn{
  flex:0 0 auto;
  padding:9px 13px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.filter-btn.active{
  background:var(--gradient);
  color:white;
  border-color:transparent;
}

/* WITHDRAWAL CARD */

.withdrawal-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.withdrawal-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:13px;
}

.amount{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.3px;
}

.person{
  margin-top:4px;
  font-size:13px;
  color:var(--muted);
  word-break:break-word;
}

.status{
  padding:5px 10px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.status-requested{
  background:rgba(245,197,24,.12);
  color:var(--gold);
}

.status-processing{
  background:rgba(79,110,247,.13);
  color:#7f9aff;
}

.status-completed{
  background:rgba(52,211,153,.12);
  color:var(--green);
}

.status-failed{
  background:rgba(248,113,113,.12);
  color:var(--red);
}

/* DETAILS */

.detail-box{
  background:#090a11;
  border:1px solid var(--border);
  border-radius:13px;
  padding:11px 13px;
  margin-bottom:13px;
}

.detail-section{
  color:#c9ccda;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
  padding-bottom:5px;
  margin-bottom:4px;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:6px 0;
  font-size:12.5px;
}

.detail-label{
  color:var(--muted);
  flex:0 0 40%;
}

.detail-value{
  text-align:right;
  font-weight:650;
  word-break:break-word;
}

/* BUTTONS */

.action-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.btn{
  flex:1;
  min-width:125px;
  padding:11px 13px;
  border-radius:11px;
  font-size:12px;
  font-weight:800;
  border:none;
  cursor:pointer;
}

.btn-processing{
  background:rgba(79,110,247,.12);
  border:1px solid rgba(79,110,247,.3);
  color:#86a0ff;
}

.btn-complete{
  background:var(--gradient);
  color:white;
}

.btn-fail{
  background:rgba(248,113,113,.08);
  border:1px solid rgba(248,113,113,.28);
  color:var(--red);
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.failure{
  background:rgba(248,113,113,.07);
  border:1px solid rgba(248,113,113,.18);
  color:var(--red);
  border-radius:11px;
  padding:10px 12px;
  font-size:12px;
  line-height:1.45;
  margin-bottom:12px;
}

/* EMPTY / LOADING */

.loading,
.empty{
  text-align:center;
  color:var(--muted);
  padding:70px 20px;
  line-height:1.6;
  font-size:13px;
}

.retry{
  margin-top:14px;
  padding:10px 18px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:white;
  font-weight:700;
}

/* MODAL */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(5px);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:200;
}

.modal-overlay.active{
  display:flex;
}

.modal{
  width:100%;
  max-width:600px;
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:24px 24px 0 0;
  padding:25px 19px calc(25px + env(safe-area-inset-bottom));
}

.modal h3{
  text-align:center;
  font-size:17px;
  margin-bottom:8px;
}

.modal p{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin-bottom:18px;
}

.modal input{
  width:100%;
  background:#090a11;
  border:1px solid var(--border);
  color:white;
  border-radius:12px;
  padding:13px;
  font-size:14px;
  outline:none;
  margin-bottom:14px;
}

.modal-actions{
  display:flex;
  gap:9px;
}

.modal-actions button{
  flex:1;
  padding:13px;
  border-radius:12px;
  border:none;
  font-weight:800;
}

.cancel{
  background:#090a11;
  border:1px solid var(--border)!important;
  color:white;
}

.confirm{
  background:var(--gradient);
  color:white;
}

.confirm.danger{
  background:var(--red);
  color:#210505;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#151621;
  border:1px solid var(--border);
  color:white;
  padding:12px 18px;
  border-radius:12px;
  font-size:12px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:300;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
}

@media(min-width:650px){
  .summary-grid{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<header class="top-header">
  <a href="command-center.html" class="back-btn">←</a>
  <div>
    <div class="header-title">Withdrawal Control</div>
    <div class="header-subtitle">Founder / Admin Command Center</div>
  </div>
</header>

<main class="main">

  <section class="window-card">
    <div class="window-top">
      <div>
        <div class="window-title">Weekly Withdrawal Window</div>
        <div class="window-text">
          Friday · 12:00 AM — 5:30 PM UTC<br>
          No withdrawal charges
        </div>
      </div>
      <div id="windowStatus" class="window-status window-closed">
        Checking...
      </div>
    </div>
  </section>

  <section class="summary-grid">
    <div class="summary-card">
      <div class="summary-label">Total Requests</div>
      <div class="summary-value" id="totalRequests">0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">Awaiting Review</div>
      <div class="summary-value gold" id="requestedCount">0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">Processing</div>
      <div class="summary-value" id="processingCount">0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">Completed</div>
      <div class="summary-value green" id="completedCount">0</div>
    </div>
  </section>

  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('requested',this)">Awaiting Review</button>
    <button class="filter-btn" onclick="setFilter('processing',this)">Processing</button>
    <button class="filter-btn" onclick="setFilter('completed',this)">Completed</button>
    <button class="filter-btn" onclick="setFilter('failed',this)">Failed</button>
  </div>

  <div id="mainContent">
    <div class="loading">Loading withdrawal requests...</div>
  </div>

</main>

<div class="modal-overlay" id="actionModal">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = "https://creator-marketplace-71rb.onrender.com";

const token =
  localStorage.getItem("af_token") ||
  localStorage.getItem("token") ||
  localStorage.getItem("authToken");

const role = localStorage.getItem("af_role");

let withdrawals = [];
let currentFilter = "all";

const CURRENCY_SYMBOLS = {
  USD:"$",
  GHS:"₵",
  NGN:"₦",
  GBP:"£",
  EUR:"€",
  KES:"KSh",
  ZAR:"R",
  CAD:"$"
};

if(!token){
  localStorage.setItem(
    "af_redirect_after_login",
    window.location.href
  );
  window.location.href = "login.html";
}

function money(amount,currency){
  const symbol = CURRENCY_SYMBOLS[currency] || "";
  return `${symbol}${Number(amount || 0).toFixed(2)} ${currency || ""}`;
}

function escapeHtml(value){
  if(value === null || value === undefined) return "";
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(value){
  if(!value) return "—";

  const date = new Date(value);

  if(isNaN(date.getTime())) return "—";

  return date.toLocaleString("en-GB",{
    day:"numeric",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function statusInfo(status){

  switch(status){

    case "requested":
      return {
        label:"Awaiting Review",
        cls:"status-requested"
      };

    case "processing":
      return {
        label:"Processing",
        cls:"status-processing"
      };

    case "completed":
      return {
        label:"Completed",
        cls:"status-completed"
      };

    case "failed":
      return {
        label:"Failed",
        cls:"status-failed"
      };

    default:
      return {
        label:status || "Unknown",
        cls:"status-requested"
      };
  }
}

function showToast(message){

  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },3000);
}

function closeModal(){
  document
    .getElementById("actionModal")
    .classList.remove("active");
}

function setFilter(filter,button){

  currentFilter = filter;

  document
    .querySelectorAll(".filter-btn")
    .forEach(btn=>btn.classList.remove("active"));

  button.classList.add("active");

  render();
}

async function loadWindow(){

  try{

    const response = await fetch(
      `${API_BASE}/withdrawal-window/status`
    );

    const data = await response.json();

    const status = document.getElementById("windowStatus");

    if(data.open){

      status.textContent = "LIVE NOW";
      status.className =
        "window-status window-open";

    }else{

      status.textContent = "CLOSED";
      status.className =
        "window-status window-closed";

    }

  }catch(error){

    document.getElementById("windowStatus").textContent =
      "Unavailable";

  }
}

function updateSummary(){

  const total = withdrawals.length;

  const requested =
    withdrawals.filter(w=>w.status==="requested").length;

  const processing =
    withdrawals.filter(w=>w.status==="processing").length;

  const completed =
    withdrawals.filter(w=>w.status==="completed").length;

  document.getElementById("totalRequests").textContent = total;
  document.getElementById("requestedCount").textContent = requested;
  document.getElementById("processingCount").textContent = processing;
  document.getElementById("completedCount").textContent = completed;
}

function render(){

  const container =
    document.getElementById("mainContent");

  let list = withdrawals;

  if(currentFilter !== "all"){
    list = withdrawals.filter(
      w=>w.status === currentFilter
    );
  }

  if(list.length === 0){

    container.innerHTML = `
      <div class="empty">
        No ${currentFilter === "all" ? "" : currentFilter + " "}
        withdrawal requests found.
      </div>
    `;

    return;
  }

  container.innerHTML = list.map(renderWithdrawal).join("");
}

function renderWithdrawal(w){

  const status = statusInfo(w.status);

  const d = w.destination_details || {};

  const canAct =
    w.status === "requested" ||
    w.status === "processing";

  const method =
    w.destination_type === "mobile_money"
      ? "Mobile Money"
      : "Bank Account";

  const phone =
    w.phone ||
    d.phone ||
    "Not provided";

  const name =
    w.full_name ||
    w.account_name ||
    "User";

  return `
    <article class="withdrawal-card">

      <div class="withdrawal-top">

        <div>

          <div class="amount">
            ${money(w.amount,w.currency)}
          </div>

          <div class="person">
            ${escapeHtml(name)}
            ${w.email ? " · " + escapeHtml(w.email) : ""}
          </div>

        </div>

        <div class="status ${status.cls}">
          ${status.label}
        </div>

      </div>

      <div class="detail-box">

        <div class="detail-section">
          Affiliate Information
        </div>

        <div class="detail-row">
          <span class="detail-label">Full name</span>
          <span class="detail-value">
            ${escapeHtml(name)}
          </span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Email</span>
          <span class="detail-value">
            ${escapeHtml(w.email || "—")}
          </span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Phone</span>
          <span class="detail-value">
            ${escapeHtml(phone)}
          </span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Currency</span>
          <span class="detail-value">
            ${escapeHtml(w.currency || "—")}
          </span>
        </div>

      </div>

      <div class="detail-box">

        <div class="detail-section">
          Withdrawal Destination
        </div>

        <div class="detail-row">
          <span class="detail-label">Method</span>
          <span class="detail-value">
            ${method}
          </span>
        </div>

        ${
          d.provider_name
          ?
          `
          <div class="detail-row">
            <span class="detail-label">
              ${w.destination_type === "mobile_money"
                ? "Network"
                : "Bank"}
            </span>

            <span class="detail-value">
              ${escapeHtml(d.provider_name)}
            </span>
          </div>
          `
          :
          ""
        }

        <div class="detail-row">
          <span class="detail-label">Account name</span>
          <span class="detail-value">
            ${escapeHtml(
              d.account_name ||
              w.account_name ||
              "—"
            )}
          </span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Account number</span>
          <span class="detail-value">
            ${escapeHtml(
              d.account_number ||
              w.account_number ||
              "—"
            )}
          </span>
        </div>

      </div>

      <div class="detail-box">

        <div class="detail-section">
          Withdrawal Record
        </div>

        <div class="detail-row">
          <span class="detail-label">Requested</span>
          <span class="detail-value">
            ${formatDate(w.requested_at)}
          </span>
        </div>

        ${
          w.processed_at
          ?
          `
          <div class="detail-row">
            <span class="detail-label">Processed</span>
            <span class="detail-value">
              ${formatDate(w.processed_at)}
            </span>
          </div>
          `
          :
          ""
        }

        ${
          w.provider_reference
          ?
          `
          <div class="detail-row">
            <span class="detail-label">Transaction reference</span>
            <span class="detail-value">
              ${escapeHtml(w.provider_reference)}
            </span>
          </div>
          `
          :
          ""
        }

        <div class="detail-row">
          <span class="detail-label">Withdrawal fee</span>
          <span class="detail-value">0.00</span>
        </div>

      </div>

      ${
        w.failure_reason
        ?
        `
        <div class="failure">
          <strong>Withdrawal failed:</strong><br>
          ${escapeHtml(w.failure_reason)}
        </div>
        `
        :
        ""
      }

      ${
        canAct
        ?
        `
        <div class="action-row">

          ${
            w.status === "requested"
            ?
            `
            <button
              class="btn btn-processing"
              onclick="confirmAction(
                '${escapeHtml(w.id)}',
                'processing'
              )"
            >
              Mark Processing
            </button>
            `
            :
            ""
          }

          <button
            class="btn btn-complete"
            onclick="confirmAction(
              '${escapeHtml(w.id)}',
              'completed'
            )"
          >
            Confirm Sent
          </button>

          <button
            class="btn btn-fail"
            onclick="confirmAction(
              '${escapeHtml(w.id)}',
              'failed'
            )"
          >
            Mark Failed
          </button>

        </div>
        `
        :
        ""
      }

    </article>
  `;
}

function confirmAction(id,status){

  const withdrawal =
    withdrawals.find(w=>String(w.id)===String(id));

  if(!withdrawal) return;

  const amount =
    money(withdrawal.amount,withdrawal.currency);

  const name =
    withdrawal.full_name ||
    withdrawal.account_name ||
    "this user";

  const isFailed = status === "failed";
  const isCompleted = status === "completed";
  const isProcessing = status === "processing";

  document.getElementById("modalContent").innerHTML = `

    <h3>
      ${
        isFailed
        ? "Mark withdrawal as failed?"
        : isCompleted
        ? "Confirm payment sent?"
        : "Move withdrawal to processing?"
      }
    </h3>

    <p>
      ${amount} to ${escapeHtml(name)}.<br><br>

      ${
        isCompleted
        ? "Only confirm this after the money has actually been sent."
        : ""
      }

      ${
        isProcessing
        ? "This tells the system that the withdrawal is currently being processed."
        : ""
      }

      ${
        isFailed
        ? "The allocated amount will be returned to the user's available balance."
        : ""
      }
    </p>

    ${
      isFailed
      ?
      `
      <input
        id="failureReason"
        type="text"
        placeholder="Reason for failure — required"
      >
      `
      :
      ""
    }

    ${
      isCompleted
      ?
      `
      <input
        id="providerReference"
        type="text"
        placeholder="Transaction reference (optional)"
      >
      `
      :
      ""
    }

    <div class="modal-actions">

      <button
        class="cancel"
        onclick="closeModal()"
      >
        Cancel
      </button>

      <button
        class="confirm ${isFailed ? "danger" : ""}"
        id="confirmButton"
        onclick="applyStatus('${escapeHtml(id)}','${status}')"
      >
        ${
          isFailed
          ? "Mark Failed"
          : isCompleted
          ? "Confirm Sent"
          : "Confirm Processing"
        }
      </button>

    </div>
  `;

  document
    .getElementById("actionModal")
    .classList.add("active");
}

async function applyStatus(id,status){

  const button =
    document.getElementById("confirmButton");

  if(!button) return;

  button.disabled = true;
  button.textContent = "Saving...";

  const body = {
    status: status
  };

  if(status === "failed"){

    const reason =
      document
        .getElementById("failureReason")
        ?.value
        .trim();

    if(!reason){

      button.disabled = false;
      button.textContent = "Mark Failed";

      showToast("Please enter a failure reason.");

      return;
    }

    body.failure_reason = reason;
  }

  if(status === "completed"){

    const reference =
      document
        .getElementById("providerReference")
        ?.value
        .trim();

    if(reference){
      body.provider_reference = reference;
    }
  }

  try{

    const response = await fetch(
      `${API_BASE}/withdrawals/${id}/status`,
      {
        method:"PUT",
        headers:{
          "Content-Type":"application/json",
          "Authorization":`Bearer ${token}`
        },
        body:JSON.stringify(body)
      }
    );

    const data = await response.json();

    if(!response.ok){

      button.disabled = false;
      button.textContent = "Try Again";

      showToast(
        data.error ||
        "Could not update withdrawal."
      );

      return;
    }

    closeModal();

    showToast("Withdrawal status updated.");

    await loadWithdrawals();

  }catch(error){

    button.disabled = false;
    button.textContent = "Try Again";

    showToast("Connection error.");
  }
}

async function loadWithdrawals(){

  if(role && role !== "admin"){

    document.getElementById("mainContent").innerHTML = `
      <div class="empty">
        This page is restricted to Founder/Admin access.
      </div>
    `;

    return;
  }

  try{

    const response = await fetch(
      `${API_BASE}/withdrawals/admin/all`,
      {
        headers:{
          "Authorization":`Bearer ${token}`
        }
      }
    );

    if(!response.ok){

      const errorData =
        await response.json()
        .catch(()=>({}));

      document.getElementById("mainContent").innerHTML = `
        <div class="empty">
          Could not load withdrawal requests.<br>
          ${escapeHtml(
            errorData.error ||
            "Please try again."
          )}
          <br>
          <button
            class="retry"
            onclick="loadWithdrawals()"
          >
            Try Again
          </button>
        </div>
      `;

      return;
    }

    const data =
      await response.json();

    withdrawals =
      Array.isArray(data.withdrawals)
        ? data.withdrawals
        : [];

    updateSummary();
    render();

  }catch(error){

    document.getElementById("mainContent").innerHTML = `
      <div class="empty">
        Connection problem while loading withdrawals.<br>
        <button
          class="retry"
          onclick="loadWithdrawals()"
        >
          Try Again
        </button>
      </div>
    `;
  }
}

document
  .getElementById("actionModal")
  .addEventListener("click",function(event){

    if(event.target === this){
      closeModal();
    }

  });

loadWindow();
loadWithdrawals();
</script>
