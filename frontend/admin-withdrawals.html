<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdrawals — Admin</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<style>
  :root {
    --bg: #05050a; --card-bg: #0f0f1a; --border: #1c1c2e;
    --accent-blue: #4f6ef7; --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc; --text-muted: #6b6b80; --input-bg: #0a0a12;
    --af-yellow: #f5c518; --success: #34d399; --error: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }

  .top-header { display: flex; align-items: center; gap: 14px; padding: 18px 16px; position: sticky; top: 0; background: rgba(5,5,10,0.9); backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid var(--border); }
  .back-btn { font-size: 20px; color: var(--text-light); text-decoration: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 10px; }
  .header-title { font-size: 16px; font-weight: 700; }

  .main-content { padding: 20px 16px; max-width: 600px; margin: 0 auto; }

  .w-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .w-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .w-amount { font-size: 19px; font-weight: 800; }
  .w-person { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .status-pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .status-requested { background: rgba(245,197,24,0.12); color: var(--af-yellow); }
  .status-processing { background: rgba(79,110,247,0.14); color: var(--accent-blue); }
  .status-completed { background: rgba(52,211,153,0.12); color: var(--success); }
  .status-failed { background: rgba(248,113,113,0.12); color: var(--error); }

  .detail-box { background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 13px; }
  .detail-label { color: var(--text-muted); }
  .detail-value { font-weight: 600; text-align: right; word-break: break-all; }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; }
  .btn-processing { background: rgba(79,110,247,0.14); color: var(--accent-blue); border: 1px solid rgba(79,110,247,0.3); }
  .btn-complete { background: var(--gradient); color: white; }
  .btn-fail { background: rgba(248,113,113,0.08); color: var(--error); border: 1px solid rgba(248,113,113,0.3); }
  .btn:disabled { opacity: 0.5; }

  .failure-note { font-size: 12.5px; color: var(--error); margin-top: 8px; line-height: 1.45; }

  .empty-state { text-align: center; padding: 70px 24px; color: var(--text-muted); font-size: 14px; line-height: 1.6; }
  .loading-text { text-align: center; color: var(--text-muted); padding: 50px; font-size: 14px; }
  .retry-btn { margin-top: 16px; padding: 11px 24px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-light); font-weight: 700; font-size: 13.5px; cursor: pointer; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--card-bg); border: 1px solid var(--border); color: var(--text-light); padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 200; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: flex-end; justify-content: center; z-index: 150; }
  .modal-overlay.active { display: flex; }
  .modal-sheet { background: var(--card-bg); border: 1px solid var(--border); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 26px 20px calc(26px + env(safe-area-inset-bottom)); width: 100%; max-width: 560px; }
  .modal-sheet h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; text-align: center; }
  .modal-sheet p { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; margin-bottom: 18px; text-align: center; }
  .modal-sheet input { width: 100%; padding: 13px 15px; background: var(--input-bg); border: 1.5px solid var(--border); border-radius: 13px; color: var(--text-light); font-size: 14.5px; outline: none; font-family: inherit; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; padding: 13px; border-radius: 12px; font-weight: 700; font-size: 14px; border: none; }
  .cancel-btn { background: var(--input-bg); border: 1px solid var(--border) !important; color: var(--text-light); }
  .confirm-btn { background: var(--gradient); color: white; }
  .confirm-btn.danger { background: var(--error); color: #1a0505; }
</style>
</head>
<body>

<div class="top-header">
  <a href="admin.html" class="back-btn">←</a>
  <div class="header-title">Withdrawals</div>
</div>

<div class="main-content" id="mainContent">
  <div class="loading-text">Loading withdrawals...</div>
</div>

<div class="modal-overlay" id="actionModal">
  <div class="modal-sheet" id="actionModalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');
  const role = localStorage.getItem('af_role');

  if (!token) {
    localStorage.setItem('af_redirect_after_login', window.location.href);
    window.location.href = 'login.html';
  }

  const CURRENCY_SYMBOLS = { USD: '$', GHS: '₵', NGN: '₦', GBP: '£', EUR: '€', KES: 'KSh', ZAR: 'R', CAD: '$' };
  function money(amount, currency) {
    const symbol = CURRENCY_SYMBOLS[currency] || '';
    return `${symbol}${Number(amount || 0).toFixed(2)}`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function statusInfo(status) {
    if (status === 'requested') return { label: 'Awaiting review', cls: 'status-requested' };
    if (status === 'processing') return { label: 'Being sent', cls: 'status-processing' };
    if (status === 'completed') return { label: 'Sent', cls: 'status-completed' };
    if (status === 'failed') return { label: 'Failed', cls: 'status-failed' };
    return { label: status, cls: 'status-requested' };
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function closeModal() {
    document.getElementById('actionModal').classList.remove('active');
  }

  function confirmAction(id, status, amount, currency, name) {
    const isFail = status === 'failed';
    const isComplete = status === 'completed';

    document.getElementById('actionModalContent').innerHTML = `
      <h3>${isFail ? 'Mark as failed?' : isComplete ? 'Confirm payment sent?' : 'Mark as being sent?'}</h3>
      <p>
        ${money(amount, currency)} to ${escapeHtml(name)}.<br>
        ${isComplete ? 'Only do this once you have actually sent the money.' : ''}
        ${isFail ? 'The full amount will be returned to their available balance.' : ''}
      </p>
      ${isFail ? `<input type="text" id="failureReason" placeholder="Reason (required)">` : ''}
      ${isComplete ? `<input type="text" id="providerRef" placeholder="Transaction reference (optional)">` : ''}
      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="confirm-btn ${isFail ? 'danger' : ''}" id="confirmBtn" onclick="applyStatus('${id}','${status}')">
          ${isFail ? 'Mark Failed' : isComplete ? 'Confirm Sent' : 'Confirm'}
        </button>
      </div>
    `;
    document.getElementById('actionModal').classList.add('active');
  }

  async function applyStatus(id, status) {
    const btn = document.getElementById('confirmBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const body = { status };

    if (status === 'failed') {
      const reason = document.getElementById('failureReason').value.trim();
      if (!reason) {
        btn.disabled = false;
        btn.textContent = 'Mark Failed';
        showToast('Please give a reason.');
        return;
      }
      body.failure_reason = reason;
    }

    if (status === 'completed') {
      const ref = document.getElementById('providerRef');
      if (ref && ref.value.trim()) body.provider_reference = ref.value.trim();
    }

    try {
      const res = await fetch(`${API_BASE}/withdrawals/${id}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify(body)
      });

      const data = await res.json();

      if (!res.ok) {
        btn.disabled = false;
        btn.textContent = 'Confirm';
        showToast(data.error || 'Could not update.');
        return;
      }

      closeModal();
      showToast('Updated.');
      load();

    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Confirm';
      showToast('Connection error.');
    }
  }

  async function load() {
    if (role !== 'admin') {
      document.getElementById('mainContent').innerHTML = `<div class="empty-state">This page is for administrators only.</div>`;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/withdrawals/admin/all`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!res.ok) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            Couldn't load withdrawals.<br>
            <button class="retry-btn" onclick="load()">Try Again</button>
          </div>`;
        return;
      }

      const data = await res.json();
      const list = data.withdrawals || [];

      if (list.length === 0) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">No withdrawal requests yet.<br>They will appear here when sellers request their earnings.</div>`;
        return;
      }

      document.getElementById('mainContent').innerHTML = list.map(w => {
        const s = statusInfo(w.status);
        const d = w.destination_details || {};
        const canAct = ['requested', 'processing'].includes(w.status);
        const nameEscaped = escapeHtml(w.full_name).replace(/'/g, "\\'");

        return `
          <div class="w-card">
            <div class="w-top">
              <div>
                <div class="w-amount">${money(w.amount, w.currency)}</div>
                <div class="w-person">${escapeHtml(w.full_name)} · ${escapeHtml(w.email)}</div>
              </div>
              <div class="status-pill ${s.cls}">${s.label}</div>
            </div>

            <div class="detail-box">
              <div class="detail-row">
                <span class="detail-label">Method</span>
                <span class="detail-value">${w.destination_type === 'mobile_money' ? 'Mobile Money' : 'Bank'}</span>
              </div>
              ${d.provider_name ? `
              <div class="detail-row">
                <span class="detail-label">${w.destination_type === 'mobile_money' ? 'Network' : 'Bank'}</span>
                <span class="detail-value">${escapeHtml(d.provider_name)}</span>
              </div>` : ''}
              <div class="detail-row">
                <span class="detail-label">Account name</span>
                <span class="detail-value">${escapeHtml(d.account_name || '')}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Number</span>
                <span class="detail-value">${escapeHtml(d.account_number || '')}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Requested</span>
                <span class="detail-value">${formatDate(w.requested_at)}</span>
              </div>
              ${w.provider_reference ? `
              <div class="detail-row">
                <span class="detail-label">Reference</span>
                <span class="detail-value">${escapeHtml(w.provider_reference)}</span>
              </div>` : ''}
            </div>

            ${w.failure_reason ? `<div class="failure-note">Failed: ${escapeHtml(w.failure_reason)}</div>` : ''}

            ${canAct ? `
              <div class="btn-row">
                ${w.status === 'requested' ? `<button class="btn btn-processing" onclick="confirmAction('${w.id}','processing',${w.amount},'${w.currency}','${nameEscaped}')">Mark Being Sent</button>` : ''}
                <button class="btn btn-complete" onclick="confirmAction('${w.id}','completed',${w.amount},'${w.currency}','${nameEscaped}')">Confirm Sent</button>
                <button class="btn btn-fail" onclick="confirmAction('${w.id}','failed',${w.amount},'${w.currency}','${nameEscaped}')">Mark Failed</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

    } catch (err) {
      document.getElementById('mainContent').innerHTML = `
        <div class="empty-state">
          Connection problem.<br>
          <button class="retry-btn" onclick="load()">Try Again</button>
        </div>`;
    }
  }

  load();
</script>

</body>
</html>
