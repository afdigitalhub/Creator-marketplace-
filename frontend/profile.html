<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
</head>
<body style="background:#05050a;color:#f2f2f7;font-family:sans-serif;padding:20px;">
  <p>Loading your profile...</p>
<script>
  const role = localStorage.getItem('af_role');
  if (role === 'business') {
    window.location.href = 'business-profile.html';
  } else if (role === 'creator') {
    window.location.href = 'creator-profile.html';
  } else if (role === 'admin') {
    window.location.href = 'admin.html';
  } else {
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
