<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">

<style>
  :root {
    --bg: #05050a;
    --card-bg: #0f0f1a;
    --border: #1c1c2e;
    --accent-blue: #4f6ef7;
    --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc;
    --text-muted: #8b8ba0;
    --input-bg: #0a0a12;
    --af-yellow: #f5c518;
    --success: #34d399;
    --error: #f87171;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: var(--bg);
    color: var(--text-light);
    font-family: -apple-system, BlinkMacSystemFont, "Inter",
      "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding-bottom: 50px;
  }

  .top-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 16px;
    position: sticky;
    top: 0;
    background: rgba(5,5,10,.94);
    backdrop-filter: blur(14px);
    z-index: 50;
    border-bottom: 1px solid var(--border);
  }

  .back-btn {
    font-size: 20px;
    color: var(--text-light);
    text-decoration: none;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card-bg);
    border-radius: 10px;
  }

  .header-title {
    font-size: 17px;
    font-weight: 800;
  }

  .main-content {
    padding: 22px 16px;
    max-width: 620px;
    margin: 0 auto;
  }

  .intro {
    margin-bottom: 20px;
  }

  .eyebrow {
    color: var(--af-yellow);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .intro h1 {
    font-size: 29px;
    line-height: 1.1;
    margin-bottom: 8px;
  }

  .intro p {
    color: var(--text-muted);
    font-size: 13.5px;
    line-height: 1.55;
  }

  .window-card {
    background: linear-gradient(
      135deg,
      rgba(79,110,247,.14),
      rgba(124,58,237,.13)
    );
    border: 1px solid rgba(139,92,246,.22);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 18px;
  }

  .window-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .window-title {
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 5px;
  }

  .window-text {
    color: var(--text-muted);
    font-size: 12.5px;
    line-height: 1.5;
  }

  .window-pill {
    white-space: nowrap;
    border-radius: 30px;
    padding: 7px 11px;
    font-size: 11px;
    font-weight: 800;
  }

  .window-open {
    color: var(--success);
    background: rgba(52,211,153,.1);
    border: 1px solid rgba(52,211,153,.25);
  }

  .window-closed {
    color: var(--af-yellow);
    background: rgba(245,197,24,.09);
    border: 1px solid rgba(245,197,24,.2);
  }

  .balance-card {
    background: linear-gradient(
      135deg,
      rgba(79,110,247,.15),
      rgba(124,58,237,.15)
    );
    border: 1px solid rgba(139,92,246,.2);
    border-radius: 20px;
    padding: 23px;
    margin-bottom: 20px;
    text-align: center;
  }

  .balance-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 8px;
  }

  .balance-value {
    font-size: 34px;
    font-weight: 900;
    margin-bottom: 5px;
  }

  .balance-note {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .currency-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 16px;
  }

  .currency-tab {
    flex: 0 0 auto;
    padding: 8px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }

  .currency-tab.active {
    color: #fff;
    background: rgba(79,110,247,.17);
    border-color: rgba(79,110,247,.45);
  }

  .form-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 19px;
    margin-bottom: 20px;
  }

  .form-title {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 17px;
  }

  .field {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 800;
    color: var(--text-muted);
    margin-bottom: 7px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }

  input,
  select {
    width: 100%;
    padding: 13px 14px;
    background: var(--input-bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text-light);
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }

  input:focus,
  select:focus {
    border-color: var(--accent-blue);
  }

  .hint {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 6px;
    line-height: 1.45;
  }

  .security-note {
    background: rgba(79,110,247,.07);
    border: 1px solid rgba(79,110,247,.15);
    border-radius: 12px;
    padding: 12px;
    margin: 5px 0 16px;
    color: #9ca9c2;
    font-size: 11.5px;
    line-height: 1.55;
  }

  .submit-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 13px;
    background: var(--gradient);
    color: white;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 4px;
  }

  .submit-btn:disabled {
    opacity: .45;
    cursor: not-allowed;
  }

  .msg-box {
    padding: 12px 14px;
    border-radius: 11px;
    font-size: 12.5px;
    margin-bottom: 16px;
    display: none;
    line-height: 1.5;
  }

  .msg-box.error {
    display: block;
    background: rgba(248,113,113,.09);
    border: 1px solid rgba(248,113,113,.28);
    color: var(--error);
  }

  .msg-box.success {
    display: block;
    background: rgba(52,211,153,.09);
    border: 1px solid rgba(52,211,153,.28);
    color: var(--success);
  }

  .section-title {
    font-size: 12px;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .07em;
    margin: 24px 0 12px;
  }

  .w-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 10px;
  }

  .w-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 7px;
  }

  .w-amount {
    font-size: 16px;
    font-weight: 900;
  }

  .status-pill {
    font-size: 10.5px;
    font-weight: 800;
    padding: 4px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .status-requested {
    background: rgba(245,197,24,.12);
    color: var(--af-yellow);
  }

  .status-processing {
    background: rgba(79,110,247,.14);
    color: var(--accent-blue);
  }

  .status-completed {
    background: rgba(52,211,153,.12);
    color: var(--success);
  }

  .status-failed {
    background: rgba(248,113,113,.12);
    color: var(--error);
  }

  .w-meta {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .w-failure {
    font-size: 12px;
    color: var(--error);
    margin-top: 7px;
    line-height: 1.45;
  }

  .info-box {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 15px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-top: 20px;
  }

  .empty-note {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.55;
    padding: 18px 0;
    text-align: center;
  }

  .loading-text {
    text-align: center;
    color: var(--text-muted);
    padding: 70px 20px;
    font-size: 14px;
  }

  .retry-btn {
    margin-top: 15px;
    padding: 10px 22px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text-light);
    font-weight: 700;
    cursor: pointer;
  }

  .hidden {
    display: none !important;
  }

  @media (max-width: 520px) {
    .window-top {
      align-items: flex-start;
      flex-direction: column;
    }

    .balance-value {
      font-size: 29px;
    }
  }
</style>
</head>

<body>

<div class="top-header">
  <a href="earnings.html" class="back-btn">←</a>
  <div class="header-title">Withdraw</div>
</div>

<div class="main-content" id="mainContent">
  <div class="loading-text">Loading your wallet...</div>
</div>

<script>
const API_BASE = "https://creator-marketplace-71rb.onrender.com";

function getToken() {
  return (
    localStorage.getItem("af_token") ||
    localStorage.getItem("token") ||
    localStorage.getItem("authToken") ||
    sessionStorage.getItem("af_token") ||
    sessionStorage.getItem("token") ||
    ""
  );
}

const token = getToken();

if (!token) {
  localStorage.setItem(
    "af_redirect_after_login",
    window.location.href
  );

  window.location.href = "signin.html";
}

const CURRENCY_SYMBOLS = {
  USD: "$",
  GHS: "₵",
  NGN: "₦",
  GBP: "£",
  EUR: "€",
  KES: "KSh",
  ZAR: "R",
  CAD: "$"
};

let balances = [];
let selectedCurrency = null;
let withdrawalWindowOpen = false;
let accountReady = false;
let hasPendingWithdrawal = false;

function money(amount, currency) {
  const symbol =
    CURRENCY_SYMBOLS[currency] || currency || "";

  return `${symbol}${Number(amount || 0).toFixed(2)}`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatDate(value) {
  if (!value) return "—";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "—";
  }

  return date.toLocaleDateString("en-GB", {
    day: "numeric",
    month: "short",
    year: "numeric"
  });
}

function showMessage(message, type) {
  const box = document.getElementById("msgBox");

  if (!box) return;

  box.textContent = message;
  box.className = `msg-box ${type}`;
}

function hideMessage() {
  const box = document.getElementById("msgBox");

  if (box) {
    box.className = "msg-box";
    box.textContent = "";
  }
}

function statusInfo(status) {
  if (status === "requested") {
    return {
      label: "Awaiting review",
      cls: "status-requested"
    };
  }

  if (status === "processing") {
    return {
      label: "Being sent",
      cls: "status-processing"
    };
  }

  if (status === "completed") {
    return {
      label: "Sent",
      cls: "status-completed"
    };
  }

  if (status === "failed") {
    return {
      label: "Failed",
      cls: "status-failed"
    };
  }

  return {
    label: status || "Unknown",
    cls: "status-requested"
  };
}

function updateWindowUI(windowData) {
  withdrawalWindowOpen = Boolean(
    windowData && windowData.open
  );

  const card = document.getElementById("windowCard");
  const pill = document.getElementById("windowPill");
  const text = document.getElementById("windowText");

  if (!card || !pill || !text) return;

  if (withdrawalWindowOpen) {
    pill.className =
      "window-pill window-open";
    pill.textContent =
      "Withdrawals Live";

    text.textContent =
      "Withdrawals are live now until 5:30 PM today. There are no withdrawal charges.";
  } else {
    pill.className =
      "window-pill window-closed";
    pill.textContent =
      "Closed";

    text.textContent =
      "Withdrawals open every Friday from 12:00 AM to 5:30 PM. There are no withdrawal charges.";
  }
}

function renderCurrencyTabs() {
  const container =
    document.getElementById("currencyTabs");

  if (!container) return;

  if (!balances.length) {
    container.innerHTML = "";
    return;
  }

  container.innerHTML =
    balances.map(row => `
      <button
        type="button"
        class="currency-tab ${
          row.currency === selectedCurrency
            ? "active"
            : ""
        }"
        onclick="selectCurrency('${escapeHtml(row.currency)}')"
      >
        ${escapeHtml(row.currency)}
      </button>
    `).join("");
}

function selectCurrency(currency) {
  selectedCurrency = currency;

  renderCurrencyTabs();
  renderSelectedBalance();
  updateFormAvailability();
}

function getSelectedBalance() {
  return balances.find(
    row => row.currency === selectedCurrency
  );
}

function renderSelectedBalance() {
  const row = getSelectedBalance();

  const value =
    document.getElementById("balanceValue");

  const label =
    document.getElementById("balanceLabel");

  const note =
    document.getElementById("balanceNote");

  if (!row) {
    value.textContent = "0";
    label.textContent =
      "Available to withdraw";
    note.textContent =
      "No available balance in this currency.";
    return;
  }

  value.textContent =
    money(row.available, row.currency);

  label.textContent =
    `${row.currency} Available Balance`;

  note.textContent =
    `Wallet balance: ${money(
      row.wallet,
      row.currency
    )}`;
}

function updateFormAvailability() {
  const row = getSelectedBalance();

  const button =
    document.getElementById("submitBtn");

  const amount =
    document.getElementById("amount");

  const min =
    50;

  if (!button) return;

  const enough =
    row &&
    Number(row.available) >= min;

  const allowed =
    withdrawalWindowOpen &&
    accountReady &&
    !hasPendingWithdrawal &&
    enough;

  button.disabled = !allowed;

  if (!withdrawalWindowOpen) {
    button.textContent =
      "Withdrawals Closed";
  } else if (!accountReady) {
    button.textContent =
      "Complete Account Details";
  } else if (hasPendingWithdrawal) {
    button.textContent =
      "Withdrawal In Progress";
  } else if (!enough) {
    button.textContent =
      "Insufficient Balance";
  } else {
    button.textContent =
      "Request Withdrawal";
  }

  if (amount && row) {
    amount.max = Number(row.available);
    amount.placeholder =
      `Maximum ${money(
        row.available,
        row.currency
      )}`;
  }
}

function updateProviderLabel() {
  const type =
    document.getElementById("destinationType");

  if (!type) return;

  const momo =
    type.value === "mobile_money";

  const providerLabel =
    document.getElementById("providerLabel");

  const provider =
    document.getElementById("providerName");

  const numberLabel =
    document.getElementById("numberLabel");

  const number =
    document.getElementById("accountNumber");

  providerLabel.textContent =
    momo ? "Network" : "Bank name";

  provider.placeholder =
    momo
      ? "e.g. MTN"
      : "e.g. GCB Bank";

  numberLabel.textContent =
    momo
      ? "Mobile money number"
      : "Bank account number";

  number.placeholder =
    momo
      ? "e.g. 0241234567"
      : "Enter account number";
}

async function api(path, options = {}) {
  const response = await fetch(
    `${API_BASE}${path}`,
    {
      ...options,
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`,
        ...(options.headers || {})
      }
    }
  );

  const text =
    await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch {
    data = {
      error:
        text ||
        "Unexpected server response"
    };
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      data.message ||
      `Request failed (${response.status})`
    );
  }

  return data;
}

function renderWithdrawals(list) {
  const container =
    document.getElementById(
      "withdrawalHistory"
    );

  if (!container) return;

  if (!list || !list.length) {
    container.innerHTML = `
      <div class="empty-note">
        You have not requested any withdrawals yet.
      </div>
    `;

    return;
  }

  container.innerHTML =
    list.map(item => {
      const status =
        statusInfo(item.status);

      const destination =
        item.destination_details || {};

      return `
        <div class="w-card">

          <div class="w-top">

            <div class="w-amount">
              ${escapeHtml(
                money(
                  item.amount,
                  item.currency
                )
              )}
            </div>

            <div class="status-pill ${
              status.cls
            }">
              ${escapeHtml(status.label)}
            </div>

          </div>

          <div class="w-meta">

            Requested
            ${escapeHtml(
              formatDate(
                item.requested_at
              )
            )}

            <br>

            ${
              item.destination_type ===
              "mobile_money"
                ? "Mobile Money"
                : "Bank Account"
            }

            ${
              destination.provider_name
                ? ` · ${escapeHtml(
                    destination.provider_name
                  )}`
                : ""
            }

            ${
              destination.account_number
                ? ` · ${escapeHtml(
                    destination.account_number
                  )}`
                : ""
            }

            ${
              item.completed_at
                ? `<br>Completed ${escapeHtml(
                    formatDate(
                      item.completed_at
                    )
                  )}`
                : ""
            }

          </div>

          ${
            item.failure_reason
              ? `
                <div class="w-failure">
                  Reason:
                  ${escapeHtml(
                    item.failure_reason
                  )}
                </div>
              `
              : ""
          }

        </div>
      `;
    }).join("");
}

async function load() {
  try {
    const data =
      await api("/withdrawals/mine");

    balances =
      Array.isArray(data.balances)
        ? data.balances
        : [];

    selectedCurrency =
      balances.length
        ? balances[0].currency
        : null;

    accountReady =
      Boolean(
        data.profile &&
        data.profile.email &&
        data.profile.phone &&
        data.profile.password_set
      );

    const list =
      data.withdrawals || [];

    hasPendingWithdrawal =
      list.some(item =>
        [
          "requested",
          "processing"
        ].includes(item.status)
      );

    document.getElementById(
      "mainContent"
    ).innerHTML = `

      <div class="intro">

        <div class="eyebrow">
          AF Digital Hub Wallet
        </div>

        <h1>
          Withdraw your earnings
        </h1>

        <p>
          Request a withdrawal from your
          available balance during the weekly
          withdrawal window.
        </p>

      </div>

      <div
        id="windowCard"
        class="window-card"
      >

        <div class="window-top">

          <div>

            <div class="window-title">
              Weekly withdrawal window
            </div>

            <div
              id="windowText"
              class="window-text"
            >
              Checking...
            </div>

          </div>

          <div
            id="windowPill"
            class="window-pill window-closed"
          >
            Checking
          </div>

        </div>

      </div>

      ${
        !accountReady
          ? `
            <div
              class="msg-box error"
              style="display:block;"
            >
              Complete your account email,
              phone number and password before
              requesting a withdrawal.
            </div>
          `
          : ""
      }

      <div class="currency-tabs" id="currencyTabs"></div>

      <div class="balance-card">

        <div
          class="balance-label"
          id="balanceLabel"
        >
          Available Balance
        </div>

        <div
          class="balance-value"
          id="balanceValue"
        >
          —
        </div>

        <div
          class="balance-note"
          id="balanceNote"
        >
          —
        </div>

      </div>

      <div class="form-card">

        <div class="form-title">
          Request a withdrawal
        </div>

        <div
          id="msgBox"
          class="msg-box"
        ></div>

        <div class="field">

          <label>
            Amount
          </label>

          <input
            type="number"
            id="amount"
            min="50"
            step="0.01"
            placeholder="Enter amount"
          >

          <div class="hint">
            Minimum withdrawal:
            50 in the selected currency.
          </div>

        </div>

        <div class="field">

          <label>
            Send to
          </label>

          <select
            id="destinationType"
            onchange="updateProviderLabel()"
          >

            <option value="mobile_money">
              Mobile Money
            </option>

            <option value="bank">
              Bank Account
            </option>

          </select>

        </div>

        <div class="field">

          <label id="providerLabel">
            Network
          </label>

          <input
            type="text"
            id="providerName"
            placeholder="e.g. MTN"
          >

        </div>

        <div class="field">

          <label>
            Account Name
          </label>

          <input
            type="text"
            id="accountName"
            placeholder="Name on the account"
            autocomplete="name"
          >

        </div>

        <div class="field">

          <label id="numberLabel">
            Mobile Money Number
          </label>

          <input
            type="text"
            id="accountNumber"
            placeholder="Enter number"
            autocomplete="tel"
          >

        </div>

        <div class="field">

          <label>
            Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="Your account phone number"
            autocomplete="tel"
          >

          <div class="hint">
            Must match the phone number
            registered on your AF Digital Hub account.
          </div>

        </div>

        <div class="field">

          <label>
            Account Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your account password"
            autocomplete="current-password"
          >

        </div>

        <div class="security-note">
          Your password is used only to confirm
          this withdrawal request. It is never
          displayed on your dashboard or stored
          in the withdrawal record.
        </div>

        <button
          class="submit-btn"
          id="submitBtn"
          onclick="submitWithdrawal()"
          disabled
        >
          Checking...
        </button>

      </div>

      <div class="section-title">
        Withdrawal History
      </div>

      <div id="withdrawalHistory">
        <div class="empty-note">
          Loading history...
        </div>
      </div>

      <div class="info-box">
        Withdrawals are available every Friday
        from 12:00 AM to 5:30 PM.
        <br><br>
        <strong style="color:#f5f7fb;">
          Withdrawal fee: 0
        </strong>
        <br>
        AF Digital Hub does not charge a withdrawal
        fee. Your withdrawal is processed after
        submission and you will receive an update
        when its status changes.
      </div>
    `;

    renderCurrencyTabs();
    renderSelectedBalance();
    renderWithdrawals(list);

    updateWindowUI(
      data.window || {
        open: false
      }
    );

    updateProviderLabel();
    updateFormAvailability();

  } catch (error) {
    console.error(
      "Withdrawal page error:",
      error
    );

    document.getElementById(
      "mainContent"
    ).innerHTML = `

      <div class="empty-note">

        Couldn't load your withdrawal
        information.

        <br>

        <button
          class="retry-btn"
          onclick="load()"
        >
          Try Again
        </button>

      </div>
    `;
  }
}

async function submitWithdrawal() {
  hideMessage();

  const row =
    getSelectedBalance();

  if (!row) {
    showMessage(
      "Select a currency with an available balance.",
      "error"
    );
    return;
  }

  if (!withdrawalWindowOpen) {
    showMessage(
      "Withdrawals are currently closed. They are live every Friday from 12:00 AM to 5:30 PM.",
      "error"
    );
    return;
  }

  if (!accountReady) {
    showMessage(
      "Complete your account details before withdrawing.",
      "error"
    );
    return;
  }

  if (hasPendingWithdrawal) {
    showMessage(
      "You already have a withdrawal in progress.",
      "error"
    );
    return;
  }

  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    );

  const destination_type =
    document.getElementById(
      "destinationType"
    ).value;

  const account_name =
    document.getElementById(
      "accountName"
    ).value.trim();

  const account_number =
    document.getElementById(
      "accountNumber"
    ).value.trim();

  const provider_name =
    document.getElementById(
      "providerName"
    ).value.trim();

  const phone =
    document.getElementById(
      "phone"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  if (!amount || amount <= 0) {
    showMessage(
      "Enter a valid withdrawal amount.",
      "error"
    );
    return;
  }

  if (amount < 50) {
    showMessage(
      "The minimum withdrawal is 50 in the selected currency.",
      "error"
    );
    return;
  }

  if (amount > Number(row.available)) {
    showMessage(
      `You only have ${money(
        row.available,
        row.currency
      )} available in ${row.currency}.`,
      "error"
    );
    return;
  }

  if (
    !account_name ||
    !account_number ||
    !provider_name ||
    !phone ||
    !password
  ) {
    showMessage(
      "Please complete all withdrawal details.",
      "error"
    );
    return;
  }

  const button =
    document.getElementById(
      "submitBtn"
    );

  button.disabled = true;
  button.textContent =
    "Submitting...";

  try {
    const data =
      await api("/withdrawals", {
        method: "POST",
        body: JSON.stringify({
          amount,
          currency:
            row.currency,
          destination_type,
          account_name,
          account_number,
          provider_name,
          phone,
          password
        })
      });

    showMessage(
      data.message ||
      "Withdrawal request received successfully.",
      "success"
    );

    document.getElementById(
      "amount"
    ).value = "";

    document.getElementById(
      "password"
    ).value = "";

    await load();

  } catch (error) {
    console.error(
      "Submit withdrawal error:",
      error
    );

    showMessage(
      error.message ||
      "Could not submit your withdrawal request.",
      "error"
    );

    button.disabled = false;
    updateFormAvailability();
  }
}

load();
</script>
