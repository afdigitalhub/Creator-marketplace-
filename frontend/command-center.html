<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07080d">
<style>
  :root {
    --bg: #07080d; --panel: #0d0f18; --border: rgba(255,255,255,.08);
    --gold: #e8b923; --blue: #5b7fd6; --violet: #8b6cd9;
    --text: #eceef3; --muted: #7b8296;
    --success: #3fbd85; --warn: #e8b923; --danger: #e2645c;
    --input-bg: #0a0a12;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; -webkit-font-smoothing: antialiased; }

  .top-header { display: flex; align-items: center; gap: 14px; padding: 18px 16px; position: sticky; top: 0; background: rgba(7,8,13,0.92); backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid var(--border); }
  .back-btn { font-size: 18px; color: var(--text); text-decoration: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; }
  .header-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .header-live { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

  .main-content { padding: 20px 16px; max-width: 620px; margin: 0 auto; }

  .hero-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 20px; }
  .hero-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; font-weight: 700; }
  .hero-value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: var(--gold); font-variant-numeric: tabular-nums; margin-bottom: 5px; }
  .hero-note { font-size: 12px; color: var(--muted); }

  .section { margin-bottom: 26px; }
  .section-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .section-icon { color: var(--muted); display: flex; }
  .section-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .stat-card { background: var(--panel); padding: 14px; }
  .stat-label { font-size: 10.5px; color: var(--muted); margin-bottom: 6px; line-height: 1.3; text-transform: uppercase; letter-spacing: .3px; }
  .stat-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stat-value.small { font-size: 15px; }
  .stat-value.good { color: var(--success); }
  .stat-value.warn { color: var(--warn); }
  .stat-value.bad { color: var(--danger); }

  .row-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; margin-bottom: 8px; }
  .row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .row-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .row-sub { font-size: 11px; color: var(--muted); }
  .row-value { font-size: 13.5px; font-weight: 700; color: var(--blue); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .alert-card { background: rgba(232,185,35,.06); border: 1px solid rgba(232,185,35,.25); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; }
  .alert-card a { color: var(--gold); text-decoration: none; font-weight: 700; font-size: 12.5px; }
  .alert-card p { font-size: 12.5px; color: #e8d9a8; line-height: 1.5; margin-bottom: 6px; }

  .empty-note { color: var(--muted); font-size: 12.5px; padding: 14px 0; line-height: 1.5; }
  .loading-text { text-align: center; color: var(--muted); padding: 50px; font-size: 13px; }
  .retry-btn { margin-top: 16px; padding: 11px 24px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-weight: 700; font-size: 13px; cursor: pointer; }

  .info-box { background: var(--input-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; font-size: 11.5px; color: var(--muted); line-height: 1.6; margin-top: 8px; }

  svg { display: block; }
</style>
</head>
<body>

<div class="top-header">
  <a href="admin.html" class="back-btn">←</a>
  <div>
    <div class="header-title">Command Center</div>
    <div class="header-live"><span class="live-dot"></span>Real data, live from the database</div>
  </div>
</div>

<div id="pinScreen" style="max-width:320px;margin:80px auto 0;padding:0 20px;text-align:center;">
  <div style="font-size:15px;font-weight:700;margin-bottom:6px;">Enter PIN</div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:20px;">Quick check before showing platform figures</div>
  <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off"
    style="width:100%;text-align:center;font-size:24px;letter-spacing:8px;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);">
  <div id="pinError" style="color:var(--danger);font-size:12px;margin-top:10px;display:none;">Incorrect PIN, try again</div>
  <button onclick="checkPin()" style="width:100%;margin-top:16px;padding:13px;border-radius:12px;border:none;background:var(--gold);color:#07070a;font-weight:800;font-size:14px;">Unlock</button>
</div>

<div class="main-content" id="mainContent" style="display:none;">
  <div class="loading-text">Loading platform figures...</div>
</div>

<script>
  const ADMIN_PIN = "4728";

  function checkPin() {
    const val = document.getElementById('pinInput').value;
    if (val === ADMIN_PIN) {
      document.getElementById('pinScreen').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      load();
    } else {
      document.getElementById('pinError').style.display = 'block';
    }
  }

  document.getElementById('pinInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkPin();
  });
</script>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');
  const role = localStorage.getItem('af_role');

  if (!token) {
    localStorage.setItem('af_redirect_after_login', window.location.href);
    window.location.href = 'signin.html';
  }

  const CURRENCY_SYMBOLS = { USD: '$', GHS: '₵', NGN: '₦', GBP: '£', EUR: '€', KES: 'KSh', ZAR: 'R', CAD: '$' };
  function money(amount, currency) {
    const symbol = CURRENCY_SYMBOLS[currency] || '₵';
    return `${symbol}${Number(amount || 0).toFixed(2)}`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  const ICONS = {
    money: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
    orders: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6M9 16h6M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/></svg>',
    people: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    shop: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
    marketplace: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    best: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>',
    recent: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>'
  };

  function sectionTitle(icon, label) {
    return `<div class="section-title-row"><span class="section-icon">${ICONS[icon]}</span><span class="section-title">${label}</span></div>`;
  }

  async function load() {
    if (role !== 'admin') {
      document.getElementById('mainContent').innerHTML = `<div class="empty-note" style="text-align:center;">This page is for administrators only.</div>`;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/admin-stats`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!res.ok) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-note" style="text-align:center;">
            Couldn't load the figures.<br>
            <button class="retry-btn" onclick="load()">Try Again</button>
          </div>`;
        return;
      }

      const d = await res.json();
      const cur = d.money.currency || 'GHS';
      const m = d.money;
      const e = d.earnings;
      const w = d.withdrawals;
      const p = d.people;
      const pr = d.products;
      const mk = d.marketplace;
      const obs = d.orders_by_status || {};

      const awaitingCount = Number(w.awaiting);
      const openReports = Number(mk.open_reports);

      let html = '';

      if (awaitingCount > 0 || openReports > 0) {
        html += `<div class="alert-card">`;
        if (awaitingCount > 0) {
          html += `<p>${awaitingCount} withdrawal${awaitingCount === 1 ? '' : 's'} awaiting your review (${money(w.awaiting_amount, cur)})</p>
                   <a href="admin-withdrawals.html">Review withdrawals →</a>`;
        }
        if (openReports > 0) {
          html += `<p style="margin-top:${awaitingCount > 0 ? '10px' : '0'};">${openReports} open report${openReports === 1 ? '' : 's'}</p>
                   <a href="admin.html">View reports →</a>`;
        }
        html += `</div>`;
      }

      html += `
        <div class="hero-card">
          <div class="hero-label">Your commission earned</div>
          <div class="hero-value">${money(m.platform_commission, cur)}</div>
          <div class="hero-note">From ${m.paid_orders} paid order${Number(m.paid_orders) === 1 ? '' : 's'}</div>
        </div>

        <div class="section">
          ${sectionTitle('money', 'Money')}
          <div class="grid">
            <div class="stat-card">
              <div class="stat-label">Total sales value</div>
              <div class="stat-value">${money(m.gross_revenue, cur)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Owed to sellers</div>
              <div class="stat-value">${money(m.seller_share, cur)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Cleared, ready to withdraw</div>
              <div class="stat-value small good">${money(e.available, cur)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Still clearing</div>
              <div class="stat-value small warn">${money(e.pending, cur)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Already paid out</div>
              <div class="stat-value small">${money(w.paid_out, cur)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Withdrawals awaiting you</div>
              <div class="stat-value small ${awaitingCount > 0 ? 'warn' : ''}">${money(w.awaiting_amount, cur)}</div>
            </div>
          </div>
        </div>

        <div class="section">
          ${sectionTitle('orders', 'Orders')}
          <div class="grid">
            <div class="stat-card">
              <div class="stat-label">Paid</div>
              <div class="stat-value good">${obs.paid || 0}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Not completed</div>
              <div class="stat-value warn">${obs.pending || 0}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Failed</div>
              <div class="stat-value ${(obs.failed || 0) > 0 ? 'bad' : ''}">${obs.failed || 0}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Refunded</div>
              <div class="stat-value">${obs.refunded || 0}</div>
            </div>
          </div>
        </div>

        <div class="section">
          ${sectionTitle('people', 'People')}
          <div class="grid">
            <div class="stat-card">
              <div class="stat-label">Total users</div>
              <div class="stat-value">${p.total_users}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">New this month</div>
              <div class="stat-value">${p.new_this_month}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Creators</div>
              <div class="stat-value small">${p.creators}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Businesses</div>
              <div class="stat-value small">${p.businesses}</div>
            </div>
          </div>
        </div>

        <div class="section">
          ${sectionTitle('shop', 'Shop')}
          <div class="grid">
            <div class="stat-card">
              <div class="stat-label">Published products</div>
              <div class="stat-value">${pr.published}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Drafts</div>
              <div class="stat-value">${pr.drafts}</div>
            </div>
          </div>
          <a href="admin-product-approvals.html" style="display:block;text-align:center;margin-top:10px;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;color:var(--gold);font-size:12.5px;font-weight:700;text-decoration:none;">
            Review pending vendor products →
          </a>
        </div>

        <div class="section">
          ${sectionTitle('marketplace', 'Marketplace')}
          <div class="grid">
            <div class="stat-card">
              <div class="stat-label">Campaigns</div>
              <div class="stat-value small">${mk.campaigns}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Applications</div>
              <div class="stat-value small">${mk.applications}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Accepted</div>
              <div class="stat-value small">${mk.accepted}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Conversations</div>
              <div class="stat-value small">${mk.conversations}</div>
            </div>
          </div>
        </div>
      `;

      html += `<div class="section">${sectionTitle('best', 'Best selling')}`;
      if (!d.top_products || d.top_products.length === 0) {
        html += `<div class="empty-note">No sales yet. This will fill in once products start selling.</div>`;
      } else {
        html += d.top_products.map(t => `
          <div class="row-card">
            <div class="row-top">
              <div>
                <div class="row-title">${escapeHtml(t.product_title)}</div>
                <div class="row-sub">${t.sales} sale${Number(t.sales) === 1 ? '' : 's'}</div>
              </div>
              <div class="row-value">${money(t.revenue, t.currency || cur)}</div>
            </div>
          </div>`).join('');
      }
      html += `</div>`;

      html += `<div class="section">${sectionTitle('recent', 'Recent sales')}`;
      if (!d.recent_orders || d.recent_orders.length === 0) {
        html += `<div class="empty-note">No sales yet.</div>`;
      } else {
        html += d.recent_orders.map(r => `
          <div class="row-card">
            <div class="row-top">
              <div>
                <div class="row-title">${escapeHtml(r.product_title)}</div>
                <div class="row-sub">${escapeHtml(r.buyer_name || 'A customer')} · ${formatDate(r.created_at)}</div>
              </div>
              <div class="row-value">${money(r.gross_amount, r.currency)}</div>
            </div>
          </div>`).join('');
      }
      html += `</div>`;

      html += `<div class="info-box">
        Every figure here comes from real records in the database. Nothing is estimated or projected.
      </div>`;

      document.getElementById('mainContent').innerHTML = html;

    } catch (err) {
      document.getElementById('mainContent').innerHTML = `
        <div class="empty-note" style="text-align:center;">
          Connection problem.<br>
          <button class="retry-btn" onclick="load()">Try Again</button>
        </div>`;
    }
  }

  // load() now runs only after the correct PIN is entered — see checkPin() above
</script>

</body>
  </html>
