<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<style>
  :root {
    --bg: #05050a; --card-bg: #0f0f1a; --border: #1c1c2e;
    --accent-blue: #4f6ef7; --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc; --text-muted: #6b6b80; --input-bg: #0a0a12;
    --af-yellow: #f5c518; --danger: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }
  .top-header { display: flex; align-items: center; gap: 14px; padding: 18px 16px; position: sticky; top: 0; background: rgba(5,5,10,0.9); backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid var(--border); }
  .back-btn { font-size: 20px; color: var(--text-light); text-decoration: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 10px; }
  .header-title { font-size: 16px; font-weight: 700; }
  .main-content { padding: 12px 16px; max-width: 560px; margin: 0 auto; }

  .convo-card { display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: var(--card-bg); border: 1px solid var(--border); text-decoration: none; color: var(--text-light); margin-bottom: 10px; position: relative; }
  .convo-cover { width: 48px; height: 64px; border-radius: 8px; background: var(--input-bg); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .convo-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .convo-info { flex: 1; min-width: 0; }
  .convo-top-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
  .convo-name { font-size: 14.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo-time { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
  .convo-context { font-size: 11.5px; color: var(--af-yellow); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo-preview { font-size: 13px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo-card.unread .convo-preview { color: var(--text-light); font-weight: 600; }
  .unread-dot { position: absolute; top: 14px; right: 14px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-blue); }

  .empty-state { text-align: center; padding: 70px 24px; color: var(--text-muted); }
  .empty-state .icon { font-size: 40px; margin-bottom: 14px; opacity: 0.5; }
  .empty-state p { font-size: 14px; line-height: 1.5; }
  .loading-text { text-align: center; color: var(--text-muted); padding: 40px; font-size: 14px; }
  .retry-btn { display: inline-block; margin-top: 16px; padding: 10px 22px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-light); font-weight: 700; font-size: 13.5px; cursor: pointer; }
</style>
</head>
<body>

<div class="top-header">
  <a href="dashboard.html" class="back-btn">←</a>
  <div class="header-title">Messages</div>
</div>

<div class="main-content" id="mainContent">
  <div class="loading-text">Loading conversations...</div>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');

  if (!token) {
    localStorage.setItem('af_redirect_after_login', window.location.href);
    window.location.href = 'login.html';
  }

  function parseJwt(tok) {
    try { return JSON.parse(atob(tok.split('.')[1])); } catch (e) { return null; }
  }

  const currentUserId = token ? (parseJwt(token) || {}).id : null;

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatRelativeTime(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    const now = new Date();
    const diffMs = now - d;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMins / 60);
    const diffDays = Math.floor(diffHours / 24);

    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins}m ago`;
    if (diffHours < 24) return `${diffHours}h ago`;
    if (diffDays < 7) return `${diffDays}d ago`;
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  async function loadConversations() {
    try {
      const res = await fetch(`${API_BASE}/messages/conversations`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (res.status === 401) {
        localStorage.setItem('af_redirect_after_login', window.location.href);
        window.location.href = 'login.html';
        return;
      }

      if (!res.ok) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <p>We couldn't load your conversations right now.</p>
            <button class="retry-btn" onclick="loadConversations()">Try Again</button>
          </div>
        `;
        return;
      }

      const data = await res.json();
      const conversations = data.conversations || [];

      if (conversations.length === 0) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="icon">💬</div>
            <p>Your conversations will appear here when you start or receive one.</p>
          </div>
        `;
        return;
      }

      document.getElementById('mainContent').innerHTML = conversations.map(c => {
        const otherName = c.buyer_id === currentUserId ? c.seller_name : c.buyer_name;
        const unread = Number(c.unread_count) > 0;
        return `
          <a href="conversation.html?id=${c.id}" class="convo-card ${unread ? 'unread' : ''}">
            <div class="convo-cover">
              ${c.product_cover_url ? `<img src="${escapeHtml(c.product_cover_url)}" alt="">` : ''}
            </div>
            <div class="convo-info">
              <div class="convo-top-row">
                <div class="convo-name">${escapeHtml(otherName || 'User')}</div>
                <div class="convo-time">${formatRelativeTime(c.last_message_at || c.created_at)}</div>
              </div>
              <div class="convo-context">Re: ${escapeHtml(c.product_title || '')}</div>
              <div class="convo-preview">${escapeHtml(c.last_message || 'Say hello to start the conversation')}</div>
            </div>
            ${unread ? '<div class="unread-dot"></div>' : ''}
          </a>
        `;
      }).join('');

    } catch (err) {
      document.getElementById('mainContent').innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <p>Connection error. Please check your connection and try again.</p>
          <button class="retry-btn" onclick="loadConversations()">Try Again</button>
        </div>
      `;
    }
  }

  loadConversations();
</script>

</body>
  </html>
