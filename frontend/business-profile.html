<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Profile — AF Digital Hub</title>
<style>
  :root {
    --bg: #05050a; --card: #0f0f1a; --border: #1f1f2e; --text: #f2f2f7;
    --muted: #9a9ab0; --accent1: #4f6ef7; --accent2: #7c3aed; --accent3: #6d28d9; --yellow: #f5c518;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
  .logo { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
  .logo span.hub { color: var(--yellow); }
  h1 { font-size: 22px; margin: 0 0 6px 0; }
  p.subtitle { color: var(--muted); margin: 0 0 24px 0; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; margin-top: 18px; }
  label:first-of-type { margin-top: 0; }
  input, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 15px; font-family: inherit; }
  textarea { resize: vertical; min-height: 90px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  button { width: 100%; margin-top: 24px; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3)); color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.6; }
  #status { margin-top: 14px; font-size: 14px; text-align: center; }
  .status-ok { color: #4ade80; }
  .status-err { color: #f87171; }
</style>
</head>
<body>

  <div class="logo">AF<span class="hub"> Digital Hub</span></div>
  <h1>Business Profile</h1>
  <p class="subtitle">This is what creators see before applying to your campaigns.</p>

  <div class="card">
    <label for="logo_url">Logo URL</label>
    <input type="text" id="logo_url" placeholder="https://...">
    <div class="hint">Paste a link to your business logo.</div>

    <label for="business_name">Business Name</label>
    <input type="text" id="business_name" placeholder="e.g. AF Digital Hub">

    <label for="description">Description</label>
    <textarea id="description" placeholder="Tell creators what your business does."></textarea>

    <label for="category">Category</label>
    <input type="text" id="category" placeholder="e.g. Fashion, Tech, Food">

    <label for="contact_email">Contact Email</label>
    <input type="text" id="contact_email" placeholder="you@business.com">

    <label for="contact_phone">Contact Phone</label>
    <input type="text" id="contact_phone" placeholder="+233...">

    <button id="saveBtn" onclick="saveProfile()">Save Profile</button>
    <div id="status"></div>
  </div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem("af_token");

  async function loadProfile() {
    try {
      const res = await fetch(`${API_BASE}/profiles/business`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      document.getElementById("logo_url").value = data.logo_url || "";
      document.getElementById("business_name").value = data.business_name || "";
      document.getElementById("description").value = data.description || "";
      document.getElementById("category").value = data.category || "";
      document.getElementById("contact_email").value = data.contact_email || "";
      document.getElementById("contact_phone").value = data.contact_phone || "";
    } catch (err) { console.error(err); }
  }

  async function saveProfile() {
    const btn = document.getElementById("saveBtn");
    const status = document.getElementById("status");
    btn.disabled = true;
    status.textContent = "Saving...";
    status.className = "";

    const body = {
      logo_url: document.getElementById("logo_url").value.trim(),
      business_name: document.getElementById("business_name").value.trim(),
      description: document.getElementById("description").value.trim(),
      category: document.getElementById("category").value.trim(),
      contact_email: document.getElementById("contact_email").value.trim(),
      contact_phone: document.getElementById("contact_phone").value.trim()
    };

    try {
      const res = await fetch(`${API_BASE}/profiles/business`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error("Save failed");
      status.textContent = "Profile saved.";
      status.className = "status-ok";
    } catch (err) {
      console.error(err);
      status.textContent = "Something went wrong. Try again.";
      status.className = "status-err";
    } finally { btn.disabled = false; }
  }

  loadProfile();
</script>
</body>
</html>
