<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnings — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<style>
  :root {
    --bg: #05050a; --card-bg: #0f0f1a; --border: #1c1c2e;
    --accent-blue: #4f6ef7; --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc; --text-muted: #6b6b80; --input-bg: #0a0a12;
    --af-yellow: #f5c518; --success: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }

  .top-header { display: flex; align-items: center; gap: 14px; padding: 18px 16px; position: sticky; top: 0; background: rgba(5,5,10,0.9); backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid var(--border); }
  .back-btn { font-size: 20px; color: var(--text-light); text-decoration: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 10px; }
  .header-title { font-size: 16px; font-weight: 700; }

  .main-content { padding: 20px 16px; max-width: 560px; margin: 0 auto; }

  .balance-card { background: linear-gradient(135deg, rgba(79,110,247,0.14), rgba(124,58,237,0.14)); border: 1px solid rgba(139,92,246,0.2); border-radius: 20px; padding: 22px; margin-bottom: 14px; text-align: center; }
  .balance-label { font-size: 12.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .balance-value { font-size: 32px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
  .balance-note { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }

  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
  .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 15px; }
  .stat-label { font-size: 11.5px; color: var(--text-muted); margin-bottom: 5px; }
  .stat-value { font-size: 17px; font-weight: 800; }

  .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }

  .earning-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 15px; margin-bottom: 10px; }
  .earning-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
  .earning-title { font-size: 14.5px; font-weight: 700; }
  .earning-net { font-size: 15px; font-weight: 800; color: var(--accent-blue); white-space: nowrap; }
  .status-pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 8px; }
  .status-pending { background: rgba(245,197,24,0.12); color: var(--af-yellow); }
  .status-available { background: rgba(52,211,153,0.12); color: var(--success); }
  .status-withdrawn { background: rgba(107,107,128,0.15); color: var(--text-muted); }
  .status-reversed { background: rgba(248,113,113,0.12); color: #f87171; }
  .earning-breakdown { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; }

  .info-box { background: var(--input-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; font-size: 12.5px; color: var(--text-muted); line-height: 1.6; margin-top: 20px; }

  .empty-state { text-align: center; padding: 60px 24px; }
  .empty-state .icon { font-size: 40px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state h2 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .empty-state p { font-size: 13.5px; color: var(--text-muted); line-height: 1.55; }

  .loading-text { text-align: center; color: var(--text-muted); padding: 50px; font-size: 14px; }
  .retry-btn { margin-top: 16px; padding: 11px 24px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-light); font-weight: 700; font-size: 13.5px; cursor: pointer; }
</style>
</head>
<body>

<div class="top-header">
  <a href="dashboard.html" class="back-btn">←</a>
  <div class="header-title">Earnings</div>
</div>

<div class="main-content" id="mainContent">
  <div class="loading-text">Loading your earnings...</div>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');

  if (!token) {
    localStorage.setItem('af_redirect_after_login', window.location.href);
    window.location.href = 'login.html';
  }

  const CURRENCY_SYMBOLS = { USD: '$', GHS: '₵', NGN: '₦', GBP: '£', EUR: '€', KES: 'KSh', ZAR: 'R', CAD: '$' };
  function money(amount, currency) {
    const symbol = CURRENCY_SYMBOLS[currency] || '';
    return `${symbol}${Number(amount || 0).toFixed(2)}`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function statusLabel(status, availableAt) {
    if (status === 'pending') {
      const when = formatDate(availableAt);
      return { text: when ? `Clears ${when}` : 'Pending', cls: 'status-pending' };
    }
    if (status === 'available') return { text: 'Available', cls: 'status-available' };
    if (status === 'withdrawn') return { text: 'Withdrawn', cls: 'status-withdrawn' };
    if (status === 'reversed') return { text: 'Reversed', cls: 'status-reversed' };
    return { text: status, cls: 'status-pending' };
  }

  async function loadEarnings() {
    try {
      const res = await fetch(`${API_BASE}/earnings`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (res.status === 401) {
        localStorage.setItem('af_redirect_after_login', window.location.href);
        window.location.href = 'login.html';
        return;
      }

      if (!res.ok) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <h2>Couldn't load your earnings</h2>
            <p>Something went wrong on our side.</p>
            <button class="retry-btn" onclick="loadEarnings()">Try Again</button>
          </div>
        `;
        return;
      }

      const data = await res.json();
      const t = data.totals;
      const cur = data.currency;
      const items = data.earnings || [];

      if (items.length === 0) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="icon">💰</div>
            <h2>No earnings yet</h2>
            <p>When someone buys one of your products, your earnings will appear here.</p>
          </div>
        `;
        return;
      }

      document.getElementById('mainContent').innerHTML = `
        <div class="balance-card">
          <div class="balance-label">Available to withdraw</div>
          <div class="balance-value">${money(t.available_total, cur)}</div>
          <div class="balance-note">Withdrawals are not available yet. This is what has cleared so far.</div>
        </div>

        <div class="stat-row">
          <div class="stat-card">
            <div class="stat-label">Pending</div>
            <div class="stat-value">${money(t.pending_total, cur)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Withdrawn</div>
            <div class="stat-value">${money(t.withdrawn_total, cur)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Lifetime earnings</div>
            <div class="stat-value">${money(t.lifetime_total, cur)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Sales</div>
            <div class="stat-value">${t.sale_count}</div>
          </div>
        </div>

        <div class="section-title">Every sale</div>
        ${items.map(e => {
          const s = statusLabel(e.status, e.available_at);
          return `
            <div class="earning-card">
              <div class="status-pill ${s.cls}">${escapeHtml(s.text)}</div>
              <div class="earning-top">
                <div class="earning-title">${escapeHtml(e.product_title || 'Sale')}</div>
                <div class="earning-net">${money(e.net_amount, e.currency)}</div>
              </div>
              <div class="earning-breakdown">
                Sold for ${money(e.gross_amount, e.currency)} on ${formatDate(e.created_at)}<br>
                Platform fee: ${money(e.platform_fee, e.currency)}
              </div>
            </div>
          `;
        }).join('')}

        <div class="info-box">
          Earnings stay pending for a short period after each sale before becoming available. This protects against refunds and chargebacks. Withdrawals are not yet available.
        </div>
      `;

    } catch (err) {
      document.getElementById('mainContent').innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <h2>Connection problem</h2>
          <p>Please check your connection and try again.</p>
          <button class="retry-btn" onclick="loadEarnings()">Try Again</button>
        </div>
      `;
    }
  }

  loadEarnings();
</script>

</body>
  </html>
