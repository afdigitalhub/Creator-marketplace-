<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Store | AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050b">
<style>
  :root {
    --bg: #05050b; --card-bg: #0f0f1a; --border: #1c1c2e;
    --gold: #ffd21a; --blue: #4e7cff; --violet: #7b45ff;
    --text-light: #f8f8fc; --text-muted: #8992a7; --input-bg: #0a0a12;
    --success: #34d399; --warn: #f5c518; --error: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text-light);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh; padding-bottom: 40px;
  }
  .top-header {
    display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 16px;
    position: sticky; top: 0; background: rgba(5,5,11,.9); backdrop-filter: blur(12px);
    z-index: 50; border-bottom: 1px solid var(--border);
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .back-btn {
    font-size: 18px; color: var(--text-light); text-decoration: none;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 9px;
  }
  .header-title { font-size: 15px; font-weight: 700; }
  .add-btn {
    background: var(--gold); color: #07070a; border: none; border-radius: 10px;
    padding: 9px 14px; font-size: 12.5px; font-weight: 800; text-decoration: none;
  }

  .wrap { max-width: 460px; margin: 0 auto; padding: 18px; }

  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
  .stat-card {
    background: linear-gradient(160deg, rgba(255,255,255,.035), rgba(255,255,255,.01));
    border: 1px solid var(--border); border-radius: 14px; padding: 14px;
  }
  .stat-value { font-size: 20px; font-weight: 850; color: var(--gold); }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  .product-row {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 10px;
  }
  .product-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .product-title { font-size: 14px; font-weight: 700; }
  .product-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
  .product-price { font-size: 14px; font-weight: 800; color: var(--gold); white-space: nowrap; }

  .badge { font-size: 10.5px; font-weight: 800; padding: 4px 9px; border-radius: 8px; display: inline-block; }
  .badge.pending { background: rgba(245,197,24,.12); color: var(--warn); }
  .badge.published { background: rgba(52,211,153,.12); color: var(--success); }
  .badge.draft { background: rgba(137,146,167,.15); color: var(--text-muted); }
  .badge.rejected { background: rgba(248,113,113,.12); color: var(--error); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 38px; margin-bottom: 14px; opacity: .5; }
  .empty-state p { font-size: 13.5px; line-height: 1.6; margin-bottom: 20px; }
  .empty-state a {
    display: inline-block; background: var(--gold); color: #07070a; text-decoration: none;
    padding: 12px 22px; border-radius: 12px; font-weight: 800; font-size: 13.5px;
  }

  .loading-text { text-align: center; color: var(--text-muted); padding: 50px; font-size: 13px; }
  .retry-btn { margin-top: 16px; padding: 11px 24px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-light); font-weight: 700; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>

<div class="top-header">
  <div class="header-left">
    <a href="dashboard.html" class="back-btn">←</a>
    <div class="header-title">My Store</div>
  </div>
  <a href="add-product.html" class="add-btn">+ Add Product</a>
</div>

<div class="wrap" id="mainContent">
  <div class="loading-text">Loading your products...</div>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');

  if (!token) {
    localStorage.setItem('af_redirect_after_login', window.location.href);
    window.location.href = 'login.html';
  }

  const CURRENCY_SYMBOLS = { USD: '$', GHS: '₵', GBP: '£', EUR: '€' };
  function money(amount, currency) {
    const symbol = CURRENCY_SYMBOLS[currency] || '₵';
    return `${symbol}${Number(amount || 0).toFixed(2)}`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  const STATUS_LABELS = {
    pending_review: { text: 'Pending Review', cls: 'pending' },
    published: { text: 'Published', cls: 'published' },
    draft: { text: 'Draft', cls: 'draft' },
    rejected: { text: 'Rejected', cls: 'rejected' }
  };

  async function load() {
    try {
      const res = await fetch(`${API_BASE}/products/mine`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (res.status === 401) {
        localStorage.setItem('af_redirect_after_login', window.location.href);
        window.location.href = 'login.html';
        return;
      }

      if (!res.ok) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <p>Couldn't load your products right now.</p>
            <button class="retry-btn" onclick="load()">Try Again</button>
          </div>`;
        return;
      }

      const data = await res.json();
      const products = data.products || [];

      if (products.length === 0) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="icon">📦</div>
            <p>You haven't listed any products yet.<br>Start selling your own digital products today.</p>
            <a href="add-product.html">+ Add Your First Product</a>
          </div>`;
        return;
      }

      const publishedCount = products.filter(p => p.status === 'published').length;
      const pendingCount = products.filter(p => p.status === 'pending_review').length;

      let html = `
        <div class="stat-row">
          <div class="stat-card">
            <div class="stat-value">${products.length}</div>
            <div class="stat-label">Total products</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${publishedCount}</div>
            <div class="stat-label">Live in Shop</div>
          </div>
        </div>
      `;

      html += products.map(p => {
        const status = STATUS_LABELS[p.status] || { text: p.status, cls: 'draft' };
        return `
          <div class="product-row">
            <div class="product-top">
              <div>
                <div class="product-title">${escapeHtml(p.title)}</div>
                <div class="product-meta">${escapeHtml(p.category || '')}</div>
              </div>
              <div class="product-price">${money(p.price, p.currency)}</div>
            </div>
            <span class="badge ${status.cls}">${status.text}</span>
          </div>
        `;
      }).join('');

      document.getElementById('mainContent').innerHTML = html;

    } catch (err) {
      document.getElementById('mainContent').innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <p>Connection error. Please try again.</p>
          <button class="retry-btn" onclick="load()">Try Again</button>
        </div>`;
    }
  }

  load();
</script>

</body>
</html>
