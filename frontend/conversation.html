<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversation — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<style>
  :root {
    --bg: #05050a; --card-bg: #0f0f1a; --border: #1c1c2e;
    --accent-blue: #4f6ef7; --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc; --text-muted: #6b6b80; --input-bg: #0a0a12;
    --af-yellow: #f5c518;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  .top-header { display: flex; align-items: center; gap: 12px; padding: 16px; background: rgba(5,5,10,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .back-btn { font-size: 20px; color: var(--text-light); text-decoration: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 10px; flex-shrink: 0; }
  .header-info { flex: 1; min-width: 0; }
  .header-name { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .header-context { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
  .header-context:hover { color: var(--accent-blue); }

  .messages-scroll { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .load-more-btn { align-self: center; padding: 8px 16px; border-radius: 20px; background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); font-size: 12.5px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }

  .msg-bubble { max-width: 78%; padding: 11px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45; word-wrap: break-word; }
  .msg-bubble.mine { align-self: flex-end; background: var(--gradient); color: white; border-bottom-right-radius: 4px; }
  .msg-bubble.theirs { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--border); color: var(--text-light); border-bottom-left-radius: 4px; }
  .msg-time { font-size: 10.5px; color: var(--text-muted); margin-top: 4px; }
  .msg-bubble.mine .msg-time { color: rgba(255,255,255,0.7); text-align: right; }

  .composer { display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(15,15,26,0.95); border-top: 1px solid var(--border); flex-shrink: 0; }
  .composer textarea { flex: 1; resize: none; max-height: 100px; padding: 11px 14px; background: var(--input-bg); border: 1.5px solid var(--border); border-radius: 20px; color: var(--text-light); font-size: 14px; font-family: inherit; outline: none; line-height: 1.4; }
  .composer textarea:focus { border-color: var(--accent-blue); }
  .send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--gradient); color: white; font-size: 18px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .send-btn:disabled { opacity: 0.5; }

  .state-block { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  .state-block .icon { font-size: 40px; margin-bottom: 14px; opacity: 0.6; }
  .state-block h2 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .state-block p { font-size: 13.5px; color: var(--text-muted); margin-bottom: 20px; }
  .state-block a, .retry-btn { display: inline-block; padding: 11px 24px; border-radius: 10px; background: var(--gradient); color: white; text-decoration: none; font-weight: 700; font-size: 13.5px; border: none; cursor: pointer; }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--card-bg); border: 1px solid var(--border); color: var(--text-light); padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 200; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="top-header" id="topHeader">
  <a href="messages.html" class="back-btn">←</a>
  <div class="header-info">
    <div class="header-name">Loading...</div>
  </div>
</div>

<div id="mainArea" class="state-block">
  <div class="icon">💬</div>
  <h2>Loading conversation...</h2>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const params = new URLSearchParams(window.location.search);
  const conversationId = params.get('id');
  const token = localStorage.getItem('af_token');

  if (!token) {
    localStorage.setItem('af_redirect_after_login', window.location.href);
    window.location.href = 'login.html';
  }

  let currentUserId = null;
  let oldestLoadedTimestamp = null;
  let hasMore = false;
  let conversationData = null;

  function parseJwt(tok) {
    try { return JSON.parse(atob(tok.split('.')[1])); } catch (e) { return null; }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function formatTime(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function showState(icon, title, message, showBackLink) {
    document.getElementById('mainArea').outerHTML = `
      <div class="state-block" id="mainArea">
        <div class="icon">${icon}</div>
        <h2>${escapeHtml(title)}</h2>
        <p>${escapeHtml(message)}</p>
        ${showBackLink ? `<a href="messages.html">Back to Messages</a>` : ''}
      </div>
    `;
  }

  function renderMessageBubble(m) {
    const mine = m.sender_id === currentUserId;
    return `
      <div class="msg-bubble ${mine ? 'mine' : 'theirs'}">
        <div>${escapeHtml(m.content)}</div>
        <div class="msg-time">${formatTime(m.created_at)}</div>
      </div>
    `;
  }

  async function loadConversationHeader() {
    try {
      const res = await fetch(`${API_BASE}/messages/conversations/${conversationId}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (res.status === 401) {
        localStorage.setItem('af_redirect_after_login', window.location.href);
        window.location.href = 'login.html';
        return null;
      }
      if (res.status === 403) {
        showState('🔒', 'Not authorized', 'You do not have access to this conversation.', true);
        return null;
      }
      if (res.status === 404) {
        showState('💬', 'Conversation not found', 'This conversation may no longer exist.', true);
        return null;
      }
      if (!res.ok) {
        showState('⚠️', 'Something went wrong', 'We could not load this conversation.', true);
        return null;
      }

      const data = await res.json();
      conversationData = data.conversation;

      const otherName = conversationData.buyer_id === currentUserId ? conversationData.seller_name : conversationData.buyer_name;

      document.getElementById('topHeader').innerHTML = `
        <a href="messages.html" class="back-btn">←</a>
        <div class="header-info">
          <div class="header-name">${escapeHtml(otherName)}</div>
          <a href="product-details.html?id=${conversationData.product_id}" class="header-context">Re: ${escapeHtml(conversationData.product_title)}</a>
        </div>
      `;

      return conversationData;
    } catch (err) {
      showState('⚠️', 'Connection error', 'Please check your connection and try again.', true);
      return null;
    }
  }

  async function loadMessages(before) {
    try {
      const url = before
        ? `${API_BASE}/messages/conversations/${conversationId}/messages?before=${encodeURIComponent(before)}`
        : `${API_BASE}/messages/conversations/${conversationId}/messages`;

      const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
      if (!res.ok) return null;

      const data = await res.json();
      return data;
    } catch (err) {
      return null;
    }
  }

  async function initialLoad() {
    const convo = await loadConversationHeader();
    if (!convo) return;

    const data = await loadMessages();
    if (!data) {
      showState('⚠️', 'Something went wrong', 'We could not load messages for this conversation.', true);
      return;
    }

    hasMore = data.has_more;
    if (data.messages.length > 0) {
      oldestLoadedTimestamp = data.messages[0].created_at;
    }

    renderMainArea(data.messages);
  }

  function renderMainArea(messages) {
    const existing = document.getElementById('mainArea');
    const scrollDiv = document.createElement('div');
    scrollDiv.className = 'messages-scroll';
    scrollDiv.id = 'messagesScroll';

    if (messages.length === 0) {
      scrollDiv.innerHTML = `
        <div style="margin: auto; text-align: center; color: var(--text-muted); font-size: 13.5px;">
          Say hello. Your conversation about "${escapeHtml(conversationData.product_title)}" starts here.
        </div>
      `;
    } else {
      scrollDiv.innerHTML =
        (hasMore ? `<button class="load-more-btn" id="loadMoreBtn" onclick="loadOlderMessages()">Load earlier messages</button>` : '') +
        messages.map(renderMessageBubble).join('');
    }

    existing.replaceWith(scrollDiv);

    const composerWrap = document.createElement('div');
    composerWrap.className = 'composer';
    composerWrap.innerHTML = `
      <textarea id="messageInput" rows="1" placeholder="Write a message..." maxlength="2000"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    `;
    document.body.appendChild(composerWrap);

    document.getElementById('messageInput').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });
    document.getElementById('messageInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    scrollDiv.scrollTop = scrollDiv.scrollHeight;
  }

  async function loadOlderMessages() {
    const btn = document.getElementById('loadMoreBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Loading...'; }

    const data = await loadMessages(oldestLoadedTimestamp);
    if (!data) {
      showToast('Could not load earlier messages.');
      if (btn) { btn.disabled = false; btn.textContent = 'Load earlier messages'; }
      return;
    }

    hasMore = data.has_more;
    if (data.messages.length > 0) {
      oldestLoadedTimestamp = data.messages[0].created_at;
    }

    const scrollDiv = document.getElementById('messagesScroll');
    const prevHeight = scrollDiv.scrollHeight;

    if (btn) btn.remove();
    if (hasMore) {
      scrollDiv.insertAdjacentHTML('afterbegin', `<button class="load-more-btn" id="loadMoreBtn" onclick="loadOlderMessages()">Load earlier messages</button>`);
    }
    scrollDiv.insertAdjacentHTML(hasMore ? 'afterbegin' : 'afterbegin', data.messages.map(renderMessageBubble).join(''));
    if (hasMore) {
      // re-attach after prepend since insertAdjacentHTML above only inserts once; reorder handled by placing button first then messages
    }

    scrollDiv.scrollTop = scrollDiv.scrollHeight - prevHeight;
  }

  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const content = input.value.trim();
    if (!content) return;

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    input.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/messages/conversations/${conversationId}/messages`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ content })
      });

      const data = await res.json();

      if (!res.ok) {
        showToast(data.error || "That message didn't send. Try again.");
        btn.disabled = false;
        input.disabled = false;
        return;
      }

      const scrollDiv = document.getElementById('messagesScroll');
      const emptyNotice = scrollDiv.querySelector('div[style*="margin: auto"]');
      if (emptyNotice) emptyNotice.remove();

      scrollDiv.insertAdjacentHTML('beforeend', renderMessageBubble(data.message));
      scrollDiv.scrollTop = scrollDiv.scrollHeight;

      input.value = '';
      input.style.height = 'auto';
      btn.disabled = false;
      input.disabled = false;
      input.focus();

    } catch (err) {
      showToast("That message didn't send. Try again.");
      btn.disabled = false;
      input.disabled = false;
    }
  }

  currentUserId = token ? (parseJwt(token) || {}).id : null;
  if (!conversationId) {
    showState('❓', 'Conversation unavailable', 'No conversation was specified.', true);
  } else {
    initialLoad();
  }
</script>

</body>
  </html>
