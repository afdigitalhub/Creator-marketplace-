<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AF Gigs | AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050b">
<style>
  :root {
    --bg: #05050b; --card-bg: #0f0f1a; --border: #1c1c2e;
    --gold: #ffd21a; --blue: #4e7cff; --violet: #7b45ff;
    --text-light: #f8f8fc; --text-muted: #8992a7; --input-bg: #0a0a12; --success: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(circle at 85% 0%, rgba(123,69,255,.14), transparent 30%), var(--bg);
    color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh; padding-bottom: 100px;
  }
  a { color: inherit; }

  .top-header {
    display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 16px;
    position: sticky; top: 0; background: rgba(5,5,11,.88); backdrop-filter: blur(14px);
    z-index: 50; border-bottom: 1px solid var(--border);
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .back-btn {
    font-size: 20px; color: var(--text-light); text-decoration: none;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    background: var(--card-bg); border-radius: 10px;
  }
  .header-title { font-size: 16px; font-weight: 800; }
  .post-btn {
    background: var(--gold); color: #07070a; font-size: 12.5px; font-weight: 800;
    padding: 9px 14px; border-radius: 10px; text-decoration: none;
  }

  .main-content { padding: 20px 16px; max-width: 480px; margin: 0 auto; }

  .page-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; line-height: 1.5; }

  .filters { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 18px; padding-bottom: 4px; }
  .filters::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex: 0 0 auto; border: 1px solid var(--border); background: var(--card-bg);
    color: var(--text-muted); border-radius: 999px; padding: 9px 15px;
    font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .filter-chip.active { background: var(--gold); color: #07070a; border-color: transparent; }

  .gig-card {
    display: block; text-decoration: none; color: var(--text-light);
    background: linear-gradient(160deg, rgba(255,255,255,.035), rgba(255,255,255,.01));
    border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 14px;
    box-shadow: 0 14px 28px -18px rgba(0,0,0,.65);
  }
  .gig-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .gig-cat {
    font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
    padding: 4px 9px; border-radius: 7px; color: #07070a;
  }
  .cat-errand { background: var(--gold); }
  .cat-voice { background: var(--blue); color: #fff; }
  .cat-review { background: var(--violet); color: #fff; }
  .cat-price_check { background: var(--gold); }

  .gig-price { font-size: 16px; font-weight: 850; color: var(--gold); white-space: nowrap; }

  .gig-title { font-size: 15.5px; font-weight: 800; margin-bottom: 4px; }
  .gig-desc {
    font-size: 12.5px; color: var(--text-muted); line-height: 1.5; margin-bottom: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .gig-meta { font-size: 11.5px; color: var(--text-muted); display: flex; gap: 10px; }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 13.5px; }
  .loading-text { text-align: center; color: var(--text-muted); padding: 30px; font-size: 13.5px; }

  .fab {
    position: fixed; bottom: 24px; right: 20px; width: 58px; height: 58px; border-radius: 20px;
    background: var(--gold); color: #07070a; display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900; text-decoration: none;
    box-shadow: 0 14px 30px -10px rgba(255,210,26,.6); z-index: 40;
  }
</style>
</head>
<body>

<div class="top-header">
  <div class="header-left">
    <a href="dashboard.html" class="back-btn">←</a>
    <div class="header-title">AF Gigs</div>
  </div>
  <a href="post-gig.html" class="post-btn">+ Post a Gig</a>
</div>

<div class="main-content">
  <div class="page-sub">Small tasks. Real pay. Claim one and get it done today.</div>

  <div class="filters" id="filters">
    <div class="filter-chip active" data-cat="">All</div>
    <div class="filter-chip" data-cat="errand">Local Errands</div>
    <div class="filter-chip" data-cat="voice">Voice & Language</div>
    <div class="filter-chip" data-cat="review">Quick Review</div>
    <div class="filter-chip" data-cat="price_check">Price Check</div>
  </div>

  <div id="gigFeed">
    <div class="loading-text">Loading gigs...</div>
  </div>
</div>

<a href="post-gig.html" class="fab">+</a>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  let activeCategory = "";

  const CURRENCY_SYMBOLS = { GHS: '₵', USD: '$', GBP: '£', EUR: '€' };
  function money(amount, currency) {
    const symbol = CURRENCY_SYMBOLS[currency] || '₵';
    return `${symbol}${Number(amount).toFixed(0)}`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function timeAgo(dateStr) {
    const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff/60) + "m ago";
    if (diff < 86400) return Math.floor(diff/3600) + "h ago";
    return Math.floor(diff/86400) + "d ago";
  }

  async function loadGigs() {
    const feed = document.getElementById('gigFeed');
    feed.innerHTML = `<div class="loading-text">Loading gigs...</div>`;

    try {
      const url = new URL(`${API_BASE}/gigs`);
      if (activeCategory) url.searchParams.set('category', activeCategory);

      const res = await fetch(url);
      const data = await res.json();

      if (!res.ok) {
        feed.innerHTML = `<div class="empty-state">Could not load gigs right now.</div>`;
        return;
      }

      const gigs = data.gigs || [];

      if (!gigs.length) {
        feed.innerHTML = `<div class="empty-state">No open gigs here yet.<br>Be the first to post one.</div>`;
        return;
      }

      feed.innerHTML = gigs.map(g => `
        <a href="gig-details.html?id=${g.id}" class="gig-card">
          <div class="gig-top">
            <span class="gig-cat cat-${g.category}">${escapeHtml(g.category_label)}</span>
            <span class="gig-price">${money(g.price, g.currency)}</span>
          </div>
          <div class="gig-title">${escapeHtml(g.title)}</div>
          <div class="gig-desc">${escapeHtml(g.description)}</div>
          <div class="gig-meta">
            ${g.city ? `<span>📍 ${escapeHtml(g.city)}</span>` : ''}
            <span>${timeAgo(g.created_at)}</span>
          </div>
        </a>
      `).join('');

    } catch (err) {
      feed.innerHTML = `<div class="empty-state">Connection error. Please try again.</div>`;
    }
  }

  document.getElementById('filters').addEventListener('click', (e) => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeCategory = chip.dataset.cat || '';
    loadGigs();
  });

  loadGigs();
</script>

</body>
</html>
