<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<style>
  :root {
    --bg: #05050a; --card-bg: #0f0f1a; --border: #1c1c2e;
    --accent-blue: #4f6ef7; --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc; --text-muted: #6b6b80; --input-bg: #0a0a12; --success: #34d399;
    --af-yellow: #f5c518;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }
  .top-header { display: flex; align-items: center; gap: 14px; padding: 18px 16px; position: sticky; top: 0; background: rgba(5,5,10,0.9); backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid var(--border); }
  .back-btn { font-size: 20px; color: var(--text-light); text-decoration: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 10px; }
  .header-title { font-size: 16px; font-weight: 700; }
  .main-content { padding: 20px 16px; max-width: 480px; margin: 0 auto; }
  .shop-intro { margin-bottom: 18px; }
  .shop-intro h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .shop-intro p { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

  .featured-section { margin-bottom: 24px; }
  .featured-section h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .featured-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .featured-scroll::-webkit-scrollbar { display: none; }
  .featured-card { flex-shrink: 0; width: 150px; text-decoration: none; color: inherit; }
  .featured-cover { width: 150px; height: 200px; border-radius: 14px; background: var(--card-bg); border: 1px solid var(--border); overflow: hidden; margin-bottom: 8px; }
  .featured-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .featured-title { font-size: 13px; font-weight: 700; line-height: 1.3; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .featured-price { font-size: 12.5px; font-weight: 700; color: var(--accent-blue); }

  .topics-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 20px; scrollbar-width: none; }
  .topics-scroll::-webkit-scrollbar { display: none; }
  .topic-chip { flex-shrink: 0; padding: 8px 15px; border-radius: 20px; background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); font-size: 12.5px; font-weight: 600; cursor: pointer; text-transform: capitalize; white-space: nowrap; }
  .topic-chip.active { background: var(--gradient); color: white; border-color: transparent; }

  .results-count { font-size: 12.5px; color: var(--text-muted); margin-bottom: 14px; }

  .product-grid { display: flex; flex-direction: column; gap: 16px; }
  .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit; display: block; transition: transform 0.15s ease, border-color 0.15s ease; }
  .product-card:active { transform: scale(0.98); border-color: var(--accent-blue); }
  .product-cover { width: 100%; aspect-ratio: 3 / 4; background: var(--input-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .product-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .product-cover.no-image { color: var(--text-muted); font-size: 13px; }
  .product-body { padding: 16px; }
  .product-category { font-size: 11px; font-weight: 700; color: var(--af-yellow); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .product-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .product-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4; }
  .product-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .product-price { font-size: 17px; font-weight: 800; color: var(--accent-blue); }
  .buy-btn { padding: 10px 20px; border-radius: 10px; background: var(--gradient); color: white; font-weight: 700; font-size: 13.5px; border: none; text-decoration: none; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }
  .loading-text { text-align: center; color: var(--text-muted); padding: 30px; font-size: 14px; }
</style>
</head>
<body>

<div class="top-header">
  <a href="javascript:history.back()" class="back-btn">←</a>
  <div class="header-title">Shop</div>
</div>

<div class="main-content">
  <div class="shop-intro">
    <h1>AF Digital Hub Shop</h1>
    <p>Practical eBooks on money, work, and everyday digital skills, written to actually be used, not just read once.</p>
  </div>

  <div id="featuredSection"></div>

  <div class="topics-scroll" id="topicsScroll"></div>
  <div class="results-count" id="resultsCount"></div>

  <div id="productList" class="product-grid"><div class="loading-text">Loading products...</div></div>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  let allProducts = [];
  let activeTopic = "all";

  const CURRENCY_SYMBOLS = { USD: '$', GHS: '₵', NGN: '₦', GBP: '£', EUR: '€', KES: 'KSh', ZAR: 'R', CAD: '$' };
  function formatMoney(amount, currency) {
    const symbol = CURRENCY_SYMBOLS[currency] || '$';
    return `${symbol}${Number(amount).toFixed(2)}`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function getTags(product) {
    if (!product.tags) return [];
    return product.tags.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
  }

  function renderFeatured() {
    const featured = allProducts.filter(p => p.is_featured);
    if (featured.length === 0) {
      document.getElementById('featuredSection').innerHTML = '';
      return;
    }

    document.getElementById('featuredSection').innerHTML = `
      <div class="featured-section">
        <h2>Featured</h2>
        <div class="featured-scroll">
          ${featured.map(p => `
            <a href="product-details.html?id=${p.id}" class="featured-card">
              <div class="featured-cover">
                ${p.cover_url ? `<img src="${escapeHtml(p.cover_url)}" alt="${escapeHtml(p.title)}" onerror="this.parentElement.innerHTML=''">` : ''}
              </div>
              <div class="featured-title">${escapeHtml(p.title)}</div>
              <div class="featured-price">${formatMoney(p.price, p.currency)}</div>
            </a>
          `).join('')}
        </div>
      </div>
    `;
  }

  function renderTopics() {
    const tagSet = new Set();
    allProducts.forEach(p => getTags(p).forEach(t => tagSet.add(t)));
    const topics = ['all', ...Array.from(tagSet).sort()];

    document.getElementById('topicsScroll').innerHTML = topics.map(t => `
      <div class="topic-chip ${t === activeTopic ? 'active' : ''}" onclick="selectTopic('${t.replace(/'/g,"\\'")}')">${t === 'all' ? 'All' : escapeHtml(t)}</div>
    `).join('');
  }

  function selectTopic(topic) {
    activeTopic = topic;
    renderTopics();
    renderProducts();
  }

  function renderProducts() {
    const filtered = activeTopic === 'all'
      ? allProducts
      : allProducts.filter(p => getTags(p).includes(activeTopic));

    document.getElementById('resultsCount').textContent =
      filtered.length === allProducts.length
        ? `${filtered.length} product${filtered.length === 1 ? '' : 's'}`
        : `${filtered.length} product${filtered.length === 1 ? '' : 's'} in ${activeTopic}`;

    if (filtered.length === 0) {
      document.getElementById('productList').innerHTML = `<div class="empty-state">Nothing in this topic yet. Check back soon.</div>`;
      return;
    }

    document.getElementById('productList').innerHTML = filtered.map(p => `
      <a href="product-details.html?id=${p.id}" class="product-card">
        <div class="product-cover ${p.cover_url ? '' : 'no-image'}">
          ${p.cover_url ? `<img src="${escapeHtml(p.cover_url)}" alt="${escapeHtml(p.title)}" onerror="this.parentElement.classList.add('no-image');this.remove();this.parentElement.textContent='No cover image'">` : 'No cover image'}
        </div>
        <div class="product-body">
          <div class="product-category">${escapeHtml(p.category || '')}</div>
          <div class="product-title">${escapeHtml(p.title)}</div>
          ${p.subtitle ? `<div class="product-subtitle">${escapeHtml(p.subtitle)}</div>` : ''}
          <div class="product-bottom">
            <div class="product-price">${formatMoney(p.price, p.currency)}</div>
            <span class="buy-btn">View</span>
          </div>
        </div>
      </a>
    `).join('');
  }

  async function loadProducts() {
    try {
      const res = await fetch(`${API_BASE}/products`);
      const data = await res.json();

      if (!res.ok) {
        document.getElementById('productList').innerHTML = `<div class="empty-state">Could not load products right now.</div>`;
        return;
      }

      allProducts = (data.products || []).filter(p => p.status === 'published');

      if (allProducts.length === 0) {
        document.getElementById('productList').innerHTML = `<div class="empty-state">No products available yet. Check back soon.</div>`;
        return;
      }

      renderFeatured();
      renderTopics();
      renderProducts();

    } catch (err) {
      document.getElementById('productList').innerHTML = `<div class="empty-state">Connection error. Please try again.</div>`;
    }
  }

  loadProducts();
</script>

</body>
    </html>
