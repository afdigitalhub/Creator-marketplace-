<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<style>
  :root {
    --bg: #05050a; --card-bg: #0f0f1a; --border: #1c1c2e;
    --accent-blue: #4f6ef7; --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc; --text-muted: #6b6b80; --input-bg: #0a0a12; --success: #34d399;
    --af-yellow: #f5c518;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }
  .top-header { display: flex; align-items: center; gap: 14px; padding: 18px 16px; position: sticky; top: 0; background: rgba(5,5,10,0.9); backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid var(--border); }
  .back-btn { font-size: 20px; color: var(--text-light); text-decoration: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 10px; }
  .header-title { font-size: 16px; font-weight: 700; }
  .main-content { padding: 20px 16px; max-width: 480px; margin: 0 auto; }
  .shop-intro { margin-bottom: 20px; }
  .shop-intro h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .shop-intro p { font-size: 13px; color: var(--text-muted); }
  .product-grid { display: flex; flex-direction: column; gap: 16px; }
  .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .product-cover { width: 100%; aspect-ratio: 3 / 4; background: var(--input-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .product-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .product-cover.no-image { color: var(--text-muted); font-size: 13px; }
  .product-body { padding: 16px; }
  .product-category { font-size: 11px; font-weight: 700; color: var(--af-yellow); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .product-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .product-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4; }
  .product-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .product-price { font-size: 17px; font-weight: 800; color: var(--accent-blue); }
  .buy-btn { padding: 10px 20px; border-radius: 10px; background: var(--gradient); color: white; font-weight: 700; font-size: 13.5px; border: none; text-decoration: none; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }
  .loading-text { text-align: center; color: var(--text-muted); padding: 30px; font-size: 14px; }
</style>
</head>
<body>

<div class="top-header">
  <a href="javascript:history.back()" class="back-btn">←</a>
  <div class="header-title">Shop</div>
</div>

<div class="main-content">
  <div class="shop-intro">
    <h1>AF Digital Hub Shop</h1>
    <p>eBooks, guides, and digital products to help you build.</p>
  </div>
  <div id="productList" class="product-grid"><div class="loading-text">Loading products...</div></div>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";

  const CURRENCY_SYMBOLS = { USD: '$', GHS: '₵', NGN: '₦', GBP: '£', EUR: '€', KES: 'KSh', ZAR: 'R', CAD: '$' };
  function formatMoney(amount, currency) {
    const symbol = CURRENCY_SYMBOLS[currency] || '$';
    return `${symbol}${Number(amount).toFixed(2)}`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function loadProducts() {
    try {
      const res = await fetch(`${API_BASE}/products`);
      const data = await res.json();

      if (!res.ok) {
        document.getElementById('productList').innerHTML = `<div class="empty-state">Could not load products right now.</div>`;
        return;
      }

      const products = (data.products || []).filter(p => p.status === 'published');

      if (products.length === 0) {
        document.getElementById('productList').innerHTML = `<div class="empty-state">No products available yet. Check back soon.</div>`;
        return;
      }

      document.getElementById('productList').innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-cover ${p.cover_url ? '' : 'no-image'}">
            ${p.cover_url ? `<img src="${escapeHtml(p.cover_url)}" alt="${escapeHtml(p.title)}">` : 'No cover image'}
          </div>
          <div class="product-body">
            <div class="product-category">${escapeHtml(p.category || '')}</div>
            <div class="product-title">${escapeHtml(p.title)}</div>
            ${p.subtitle ? `<div class="product-subtitle">${escapeHtml(p.subtitle)}</div>` : ''}
            <div class="product-bottom">
              <div class="product-price">${formatMoney(p.price, p.currency)}</div>
              <button class="buy-btn" onclick="alert('Purchasing is coming soon!')">Buy Now</button>
            </div>
          </div>
        </div>
      `).join('');

    } catch (err) {
      document.getElementById('productList').innerHTML = `<div class="empty-state">Connection error. Please try again.</div>`;
    }
  }

  loadProducts();
</script>

</body>
  </html>
