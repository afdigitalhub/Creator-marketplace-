<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Learning | AF Digital Hub</title>
<meta name="theme-color" content="#05050b">

<style>
:root{
  --bg:#05050b;
  --card:#0f101a;
  --border:#202235;
  --gold:#ffd21a;
  --blue:#4e7cff;
  --violet:#7b45ff;
  --text:#f8f8fc;
  --muted:#8992a7;
  --green:#34d399;
  --red:#f87171;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:
    radial-gradient(circle at 85% 0%,rgba(123,69,255,.14),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;
  padding-bottom:40px;
}

a{
  color:inherit;
  text-decoration:none;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:13px;
  padding:15px 16px;
  background:rgba(5,5,11,.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}

.back{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:11px;
  display:grid;
  place-items:center;
  font-size:21px;
}

.logo{
  width:34px;
  height:34px;
  border-radius:9px;
  overflow:hidden;
  background:#05050a;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.brand{
  font-size:15px;
  font-weight:850;
}

.brand span{
  color:var(--gold);
}

.container{
  width:min(1000px,100%);
  margin:auto;
  padding:22px 16px;
}

.hero{
  margin-bottom:22px;
}

.hero h1{
  font-size:27px;
  line-height:1.15;
  letter-spacing:-.6px;
  margin-bottom:7px;
}

.hero p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.course-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
  transition:.18s ease;
}

.course-card:hover{
  border-color:rgba(78,124,255,.35);
  transform:translateY(-1px);
}

.cover{
  width:100%;
  aspect-ratio:16/9;
  background:#090a12;
  overflow:hidden;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.body{
  padding:15px;
}

.badge{
  display:inline-flex;
  padding:5px 8px;
  border-radius:999px;
  background:rgba(52,211,153,.08);
  color:var(--green);
  border:1px solid rgba(52,211,153,.16);
  font-size:9.5px;
  font-weight:850;
  margin-bottom:8px;
}

.title{
  font-size:15px;
  font-weight:850;
  line-height:1.3;
  margin-bottom:6px;
}

.description{
  color:var(--muted);
  font-size:11.5px;
  line-height:1.45;
  min-height:34px;
}

.progress-area{
  margin-top:14px;
}

.progress-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:7px;
}

.progress-label{
  color:var(--muted);
  font-size:10.5px;
}

.progress-value{
  color:var(--gold);
  font-size:10.5px;
  font-weight:850;
}

.track{
  height:7px;
  width:100%;
  background:#1a1c27;
  border-radius:999px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0%;
  border-radius:999px;
  background:linear-gradient(
    90deg,
    var(--gold),
    var(--blue),
    var(--violet)
  );
}

.open{
  display:block;
  margin-top:14px;
  text-align:center;
  background:var(--gold);
  color:#07070a;
  padding:11px;
  border-radius:10px;
  font-size:12px;
  font-weight:900;
}

.empty{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:35px 20px;
  text-align:center;
}

.empty-icon{
  font-size:35px;
  margin-bottom:10px;
}

.empty h2{
  font-size:18px;
  margin-bottom:7px;
}

.empty p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin-bottom:18px;
}

.browse{
  display:inline-block;
  background:var(--gold);
  color:#07070a;
  padding:12px 18px;
  border-radius:10px;
  font-size:12.5px;
  font-weight:900;
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:60px 10px;
}

.error{
  text-align:center;
  color:var(--red);
  padding:50px 10px;
  font-size:13px;
}

.login-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:35px 20px;
  text-align:center;
}

.login-box h2{
  font-size:19px;
  margin-bottom:7px;
}

.login-box p{
  color:var(--muted);
  font-size:13px;
  margin-bottom:18px;
}

.login-btn{
  display:inline-block;
  background:var(--gold);
  color:#07070a;
  padding:12px 18px;
  border-radius:10px;
  font-size:12.5px;
  font-weight:900;
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header class="header">

  <a
    href="dashboard.html"
    class="back"
    aria-label="Back"
  >
    ‹
  </a>

  <div class="logo">
    <img
      src="icons/logo-mark.png"
      alt="AF Digital Hub"
    >
  </div>

  <div class="brand">
    AF Digital <span>Hub</span>
  </div>

</header>

<main class="container">

  <div id="loading" class="loading">
    Loading your learning...
  </div>

  <div
    id="loginRequired"
    style="display:none;"
  >

    <div class="login-box">

      <h2>Sign in to view your learning</h2>

      <p>
        Your enrolled courses will appear here after you sign in.
      </p>

      <a
        href="signin.html"
        class="login-btn"
      >
        Sign In
      </a>

    </div>

  </div>

  <div
    id="error"
    class="error"
    style="display:none;"
  ></div>

  <div
    id="learning"
    style="display:none;"
  >

    <section class="hero">

      <h1>
        My Learning
      </h1>

      <p>
        Continue your courses and keep building your skills.
      </p>

    </section>

    <div
      id="courseGrid"
      class="grid"
    ></div>

  </div>

</main>

<script>

const API_BASE =
  "https://creator-marketplace-71rb.onrender.com";

/*
  IMPORTANT:
  AF Digital Hub currently stores the authenticated
  user token under "af_token".
*/
function getToken(){

  return (
    localStorage.getItem("af_token") ||
    localStorage.getItem("token") ||
    localStorage.getItem("authToken") ||
    localStorage.getItem("accessToken") ||
    localStorage.getItem("jwt") ||
    ""
  );
}

const token =
  getToken();

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function show(id){

  document.getElementById(id).style.display =
    "block";
}

function hide(id){

  document.getElementById(id).style.display =
    "none";
}

function getCourseId(item){

  return (
    item.course_id ||
    item.courseId ||
    item.course?.id ||
    item.id
  );
}

function getProductId(item){

  return (
    item.product_id ||
    item.productId ||
    item.course?.product_id ||
    item.course?.product?.id ||
    null
  );
}

function getTitle(item){

  return (
    item.course_title ||
    item.title ||
    item.course?.title ||
    item.product?.title ||
    "Course"
  );
}

function getDescription(item){

  return (
    item.short_description ||
    item.description ||
    item.course?.short_description ||
    item.course?.description ||
    "Continue learning on AF Digital Hub."
  );
}

function getCover(item){

  return (
    item.cover_url ||
    item.course?.cover_url ||
    item.course?.product?.cover_url ||
    item.product?.cover_url ||
    ""
  );
}

function getProgress(item){

  const possible =
    item.progress_percent ??
    item.progress ??
    item.completion_percent ??
    item.course_progress ??
    item.course?.progress_percent ??
    0;

  if(
    typeof possible === "object" &&
    possible !== null
  ){

    if(
      possible.percent !== undefined
    ){
      return Number(
        possible.percent
      );
    }

    if(
      possible.completed !== undefined &&
      possible.total !== undefined
    ){

      const total =
        Number(possible.total);

      if(total > 0){

        return Math.round(
          Number(possible.completed) /
          total *
          100
        );
      }
    }
  }

  return Math.max(
    0,
    Math.min(
      100,
      Number(possible) || 0
    )
  );
}

async function loadLearning(){

  if(!token){

    hide("loading");
    show("loginRequired");

    return;
  }

  try{

    const response =
      await fetch(
        `${API_BASE}/courses/mine/learning`,
        {
          headers:{
            "Authorization":
              `Bearer ${token}`
          }
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.message ||
        data.error ||
        "Could not load your courses."
      );
    }

    let courses =
      data.courses ||
      data.learning ||
      data.enrollments ||
      data.items ||
      [];

    if(
      !Array.isArray(courses)
    ){

      courses = [];
    }

    renderCourses(
      courses
    );

  }catch(error){

    console.error(error);

    hide("loading");

    const errorBox =
      document.getElementById(
        "error"
      );

    errorBox.textContent =
      error.message ||
      "Could not load your learning.";

    show("error");
  }
}

function renderCourses(courses){

  hide("loading");

  show("learning");

  const grid =
    document.getElementById(
      "courseGrid"
    );

  if(!courses.length){

    grid.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          🎓
        </div>

        <h2>
          Your learning starts here
        </h2>

        <p>
          You haven't enrolled in a course yet.
          Explore professional courses on AF Digital Hub
          and start learning.
        </p>

        <a
          href="courses.html"
          class="browse"
        >
          Browse Courses
        </a>

      </div>
    `;

    return;
  }

  grid.innerHTML =
    courses.map(
      item => {

        const courseId =
          getCourseId(item);

        const productId =
          getProductId(item);

        const title =
          getTitle(item);

        const description =
          getDescription(item);

        const cover =
          getCover(item);

        const percent =
          getProgress(item);

        const completed =
          percent >= 100;

        const targetId =
          courseId || productId;

        return `
          <article class="course-card">

            <div class="cover">

              ${
                cover
                  ? `
                    <img
                      src="${escapeHtml(cover)}"
                      alt="${escapeHtml(title)}"
                      loading="lazy"
                    >
                  `
                  : `
                    <div style="
                      width:100%;
                      height:100%;
                      display:grid;
                      place-items:center;
                      color:#8992a7;
                      font-size:35px;
                    ">
                      📚
                    </div>
                  `
              }

            </div>

            <div class="body">

              <div class="badge">
                ${
                  completed
                    ? "COMPLETED"
                    : "ENROLLED"
                }
              </div>

              <div class="title">
                ${escapeHtml(title)}
              </div>

              <div class="description">
                ${escapeHtml(description)}
              </div>

              <div class="progress-area">

                <div class="progress-top">

                  <div class="progress-label">
                    Progress
                  </div>

                  <div class="progress-value">
                    ${percent}%
                  </div>

                </div>

                <div class="track">

                  <div
                    class="bar"
                    style="width:${percent}%"
                  ></div>

                </div>

              </div>

              ${
                targetId
                  ? `
                    <a
                      class="open"
                      href="course-learn.html?id=${encodeURIComponent(targetId)}"
                    >
                      ${
                        completed
                          ? "Review Course"
                          : percent > 0
                            ? "Continue Learning"
                            : "Start Learning"
                      }
                    </a>
                  `
                  : `
                    <div
                      class="open"
                      style="opacity:.5;"
                    >
                      Course unavailable
                    </div>
                  `
              }

            </div>

          </article>
        `;

      }
    ).join("");
}

loadLearning();

</script>

</body>
  </html>
