<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Confirmation | AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050b">
<style>
  :root {
    --bg: #05050b; --card-bg: #0f0f1a; --border: #1c1c2e;
    --gold: #ffd21a; --text-light: #f8f8fc; --text-muted: #8992a7;
    --success: #34d399; --error: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text-light);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    max-width: 400px; width: 100%; text-align: center;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 32px 24px;
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 19px; margin-bottom: 10px; }
  p { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 22px; }
  a.btn {
    display: inline-block; background: var(--gold); color: #07070a; font-weight: 800;
    padding: 13px 24px; border-radius: 12px; text-decoration: none; font-size: 14px;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="icon">⏳</div>
  <h1>Confirming your payment...</h1>
  <p>Please wait a moment while we confirm this with Paystack.</p>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');

  const params = new URLSearchParams(window.location.search);
  const reference = params.get('reference') || params.get('trxref');

  async function confirm() {
    if (!token) {
      window.location.href = 'signin.html';
      return;
    }
    if (!reference) {
      renderResult(false, "No payment reference was found.", null);
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/gigs/verify/${reference}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();

      if (!res.ok) {
        renderResult(false, data.error || "We could not confirm this payment.", null);
        return;
      }

      renderResult(true, "Your gig is now live and visible to workers.", data.gig ? data.gig.id : null);

    } catch (err) {
      renderResult(false, "Connection error while confirming payment.", null);
    }
  }

  function renderResult(success, message, gigId) {
    const card = document.getElementById('card');
    if (success) {
      card.innerHTML = `
        <div class="icon">✅</div>
        <h1>Payment confirmed!</h1>
        <p>${message}</p>
        <a class="btn" href="${gigId ? 'gig-details.html?id=' + gigId : 'gigs.html'}">View Your Gig</a>
      `;
    } else {
      card.innerHTML = `
        <div class="icon">⚠️</div>
        <h1>We couldn't confirm this yet</h1>
        <p>${message} If money was deducted, it will be confirmed shortly — check "My Gigs" in a few minutes.</p>
        <a class="btn" href="gigs.html">Back to AF Gigs</a>
      `;
    }
  }

  confirm();
</script>

</body>
</html>
