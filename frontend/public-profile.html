<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<style>
  :root {
    --bg: #05050a; --card-bg: #0f0f1a; --border: #1c1c2e;
    --accent-blue: #4f6ef7; --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc; --text-muted: #6b6b80; --input-bg: #0a0a12;
    --af-yellow: #f5c518; --success: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 50px; }
  .top-header { display: flex; align-items: center; gap: 14px; padding: 18px 16px; position: sticky; top: 0; background: rgba(5,5,10,0.9); backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid var(--border); }
  .back-btn { font-size: 20px; color: var(--text-light); text-decoration: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 10px; }
  .header-title { font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main-content { padding: 24px 16px; max-width: 560px; margin: 0 auto; }

  .hero { text-align: center; margin-bottom: 26px; }
  .avatar { width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 14px; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; color: white; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-name { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .profile-headline { font-size: 14.5px; color: var(--af-yellow); font-weight: 600; margin-bottom: 6px; }
  .role-pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 4px 12px; border-radius: 20px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text-muted); text-transform: capitalize; }

  .section { margin-bottom: 26px; }
  .section h2 { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .about-text { font-size: 14.5px; line-height: 1.65; color: #d8d8e6; white-space: pre-line; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 7px 14px; font-size: 13px; }

  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 15px; margin-bottom: 10px; }
  .card-title { font-size: 14.5px; font-weight: 700; margin-bottom: 5px; }
  .card-desc { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; }
  .card-link { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--accent-blue); text-decoration: none; word-break: break-all; }

  .link-row { display: flex; align-items: center; gap: 10px; padding: 12px 15px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; text-decoration: none; color: var(--text-light); }
  .link-label { font-size: 14px; font-weight: 600; flex: 1; }
  .link-arrow { color: var(--text-muted); font-size: 14px; }

  .product-grid { display: flex; flex-direction: column; gap: 10px; }
  .product-card { display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: var(--card-bg); border: 1px solid var(--border); text-decoration: none; color: var(--text-light); }
  .product-cover { width: 52px; height: 68px; border-radius: 8px; background: var(--input-bg); flex-shrink: 0; overflow: hidden; }
  .product-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .product-info { flex: 1; min-width: 0; }
  .product-title { font-size: 13.5px; font-weight: 700; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .product-price { font-size: 12.5px; font-weight: 700; color: var(--accent-blue); }

  .rating-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .rating-value { font-size: 18px; font-weight: 800; color: var(--af-yellow); }
  .rating-count { font-size: 13px; color: var(--text-muted); }
  .review-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .review-top { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .reviewer-name { font-size: 13.5px; font-weight: 700; }
  .review-stars { font-size: 13px; color: var(--af-yellow); }
  .review-comment { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; }

  .empty-note { color: var(--text-muted); font-size: 13.5px; }
  .state-block { text-align: center; padding: 70px 24px; }
  .state-block .icon { font-size: 40px; margin-bottom: 14px; opacity: 0.6; }
  .state-block h2 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .state-block p { font-size: 13.5px; color: var(--text-muted); }
  .loading-text { text-align: center; color: var(--text-muted); padding: 50px; font-size: 14px; }
</style>
</head>
<body>

<div class="top-header">
  <a href="javascript:history.back()" class="back-btn">←</a>
  <div class="header-title" id="headerTitle">Profile</div>
</div>

<div class="main-content" id="mainContent">
  <div class="loading-text">Loading profile...</div>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');
  const params = new URLSearchParams(window.location.search);
  const userId = params.get('id');

  if (!token) {
    localStorage.setItem('af_redirect_after_login', window.location.href);
    window.location.href = 'login.html';
  }

  const CURRENCY_SYMBOLS = { USD: '$', GHS: '₵', NGN: '₦', GBP: '£', EUR: '€', KES: 'KSh', ZAR: 'R', CAD: '$' };
  function formatMoney(amount, currency) {
    const symbol = CURRENCY_SYMBOLS[currency] || '$';
    return `${symbol}${Number(amount).toFixed(2)}`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function stars(rating) {
    const r = Math.round(Number(rating) || 0);
    return '★'.repeat(r) + '☆'.repeat(5 - r);
  }

  function showState(icon, title, message) {
    document.getElementById('mainContent').innerHTML = `
      <div class="state-block">
        <div class="icon">${icon}</div>
        <h2>${escapeHtml(title)}</h2>
        <p>${escapeHtml(message)}</p>
      </div>
    `;
  }

  async function loadProfile() {
    if (!userId) {
      showState('❓', 'Profile unavailable', 'No profile was specified.');
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/professional-profiles/${encodeURIComponent(userId)}`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      if (res.status === 404) {
        showState('👤', 'Profile not found', 'This person may no longer be on AF Digital Hub.');
        return;
      }
      if (!res.ok) {
        showState('⚠️', 'Something went wrong', 'We could not load this profile right now.');
        return;
      }

      const d = await res.json();
      const p = d.professional || {};
      const role = d.role_data || {};

      document.getElementById('headerTitle').textContent = d.full_name;

      const photo = role.photo_url || role.logo_url || null;
      const displayName = role.business_name || d.full_name;

      let html = `
        <div class="hero">
          <div class="avatar">
            ${photo ? `<img src="${escapeHtml(photo)}" alt="" onerror="this.parentElement.textContent='${escapeHtml(displayName.charAt(0).toUpperCase())}'">` : escapeHtml(displayName.charAt(0).toUpperCase())}
          </div>
          <div class="profile-name">${escapeHtml(displayName)}</div>
          ${p.headline ? `<div class="profile-headline">${escapeHtml(p.headline)}</div>` : ''}
          <div class="role-pill">${escapeHtml(d.role)}</div>
        </div>
      `;

      if (p.about) {
        html += `<div class="section"><h2>About</h2><div class="about-text">${escapeHtml(p.about)}</div></div>`;
      }

      if (p.skills && p.skills.length > 0) {
        html += `<div class="section"><h2>Skills</h2><div class="chip-row">${p.skills.map(s => `<span class="chip">${escapeHtml(s)}</span>`).join('')}</div></div>`;
      }

      // Role-specific: creator niches / business category
      if (d.role === 'creator' && role.niches && role.niches.length > 0) {
        html += `<div class="section"><h2>Niches</h2><div class="chip-row">${role.niches.map(n => `<span class="chip">${escapeHtml(n)}</span>`).join('')}</div></div>`;
      }
      if (d.role === 'business') {
        if (role.category) {
          html += `<div class="section"><h2>Industry</h2><div class="chip-row"><span class="chip">${escapeHtml(role.category)}</span></div></div>`;
        }
        if (role.description) {
          html += `<div class="section"><h2>About the business</h2><div class="about-text">${escapeHtml(role.description)}</div></div>`;
        }
      }
      if (d.role === 'creator' && role.bio) {
        html += `<div class="section"><h2>Creator bio</h2><div class="about-text">${escapeHtml(role.bio)}</div></div>`;
      }

      if (p.portfolio && p.portfolio.length > 0) {
        html += `<div class="section"><h2>Portfolio</h2>${p.portfolio.map(item => `
          <div class="card">
            <div class="card-title">${escapeHtml(item.title)}</div>
            ${item.description ? `<div class="card-desc">${escapeHtml(item.description)}</div>` : ''}
            ${item.url ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="card-link">${escapeHtml(item.url)}</a>` : ''}
          </div>
        `).join('')}</div>`;
      }

      if (d.products && d.products.length > 0) {
        html += `<div class="section"><h2>Products</h2><div class="product-grid">${d.products.map(pr => `
          <a href="product-details.html?id=${pr.id}" class="product-card">
            <div class="product-cover">${pr.cover_url ? `<img src="${escapeHtml(pr.cover_url)}" alt="" onerror="this.remove()">` : ''}</div>
            <div class="product-info">
              <div class="product-title">${escapeHtml(pr.title)}</div>
              <div class="product-price">${formatMoney(pr.price, pr.currency)}</div>
            </div>
          </a>
        `).join('')}</div></div>`;
      }

      if (p.links && p.links.length > 0) {
        html += `<div class="section"><h2>Links</h2>${p.links.map(l => `
          <a href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer" class="link-row">
            <span class="link-label">${escapeHtml(l.label)}</span>
            <span class="link-arrow">↗</span>
          </a>
        `).join('')}</div>`;
      }

      if (Number(d.total_reviews) > 0) {
        html += `
          <div class="section">
            <h2>Reviews</h2>
            <div class="rating-row">
              <span class="rating-value">${escapeHtml(d.average_rating)}</span>
              <span class="review-stars">${stars(d.average_rating)}</span>
              <span class="rating-count">(${escapeHtml(d.total_reviews)} review${Number(d.total_reviews) === 1 ? '' : 's'})</span>
            </div>
            ${d.reviews.map(r => `
              <div class="review-card">
                <div class="review-top">
                  <span class="reviewer-name">${escapeHtml(r.reviewer_name)}</span>
                  <span class="review-stars">${stars(r.rating)}</span>
                </div>
                ${r.comment ? `<div class="review-comment">${escapeHtml(r.comment)}</div>` : ''}
              </div>
            `).join('')}
          </div>
        `;
      }

      // If the profile is essentially empty, say so honestly
      const hasAnything = p.headline || p.about || (p.skills && p.skills.length) ||
        (p.portfolio && p.portfolio.length) || (p.links && p.links.length) ||
        (d.products && d.products.length) || Number(d.total_reviews) > 0;

      if (!hasAnything) {
        html += `<div class="section"><p class="empty-note">This person hasn't added profile details yet.</p></div>`;
      }

      document.getElementById('mainContent').innerHTML = html;

    } catch (err) {
      showState('⚠️', 'Connection error', 'Please check your connection and try again.');
    }
  }

  loadProfile();
</script>

</body>
  </html>
