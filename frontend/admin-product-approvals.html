<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Approvals | AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050b">
<style>
  :root {
    --bg: #05050b; --card-bg: #0f0f1a; --border: #1c1c2e;
    --gold: #ffd21a; --text-light: #f8f8fc; --text-muted: #8992a7;
    --input-bg: #0a0a12; --success: #34d399; --error: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text-light);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh; padding-bottom: 40px;
  }
  .top-header {
    display: flex; align-items: center; gap: 14px; padding: 18px 16px;
    position: sticky; top: 0; background: rgba(5,5,11,.9); backdrop-filter: blur(12px);
    z-index: 50; border-bottom: 1px solid var(--border);
  }
  .back-btn {
    font-size: 18px; color: var(--text-light); text-decoration: none;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 9px;
  }
  .header-title { font-size: 15px; font-weight: 700; }

  .wrap { max-width: 460px; margin: 0 auto; padding: 18px; }

  .count-pill {
    display: inline-block; background: rgba(255,210,26,.1); border: 1px solid rgba(255,210,26,.3);
    color: var(--gold); font-size: 12px; font-weight: 800; padding: 6px 14px; border-radius: 999px;
    margin-bottom: 18px;
  }

  .product-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; margin-bottom: 14px;
  }
  .p-cover { width: 100%; height: 140px; border-radius: 12px; background: var(--input-bg); overflow: hidden; margin-bottom: 12px; }
  .p-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .p-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .p-seller { font-size: 12px; color: var(--gold); margin-bottom: 8px; }
  .p-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; margin-bottom: 10px; }
  .p-meta-row { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 14px; }
  .p-price { font-weight: 800; }
  .p-cat { color: var(--text-muted); }
  .p-links { font-size: 11.5px; margin-bottom: 14px; }
  .p-links a { color: var(--text-muted); word-break: break-all; }

  .action-row { display: flex; gap: 10px; }
  .btn { flex: 1; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 800; border: none; cursor: pointer; }
  .btn-approve { background: var(--success); color: #07070a; }
  .btn-reject { background: rgba(248,113,113,.12); color: var(--error); border: 1px solid rgba(248,113,113,.3); }
  .btn:disabled { opacity: .5; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 38px; margin-bottom: 14px; opacity: .5; }
  .empty-state p { font-size: 13.5px; line-height: 1.6; }
  .loading-text { text-align: center; color: var(--text-muted); padding: 50px; font-size: 13px; }
</style>
</head>
<body>

<div class="top-header">
  <a href="admin.html" class="back-btn">←</a>
  <div class="header-title">Product Approvals</div>
</div>

<div class="wrap" id="mainContent">
  <div class="loading-text">Loading pending products...</div>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');
  const role = localStorage.getItem('af_role');

  if (!token) {
    window.location.href = 'login.html';
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  const CURRENCY_SYMBOLS = { USD: '$', GHS: '₵', GBP: '£', EUR: '€' };
  function money(amount, currency) {
    const symbol = CURRENCY_SYMBOLS[currency] || '₵';
    return `${symbol}${Number(amount || 0).toFixed(2)}`;
  }

  let pendingProducts = [];

  async function load() {
    if (role !== 'admin') {
      document.getElementById('mainContent').innerHTML = `<div class="empty-state"><p>This page is for administrators only.</p></div>`;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/products/admin/all`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!res.ok) {
        document.getElementById('mainContent').innerHTML = `<div class="empty-state"><p>Couldn't load products.</p></div>`;
        return;
      }

      const data = await res.json();
      pendingProducts = (data.products || []).filter(p => p.status === 'pending_review');

      render();

    } catch (err) {
      document.getElementById('mainContent').innerHTML = `<div class="empty-state"><p>Connection error. Please try again.</p></div>`;
    }
  }

  function render() {
    const box = document.getElementById('mainContent');

    if (pendingProducts.length === 0) {
      box.innerHTML = `
        <div class="empty-state">
          <div class="icon">✅</div>
          <p>No products waiting for review right now.</p>
        </div>`;
      return;
    }

    box.innerHTML = `<div class="count-pill">${pendingProducts.length} awaiting review</div>` +
      pendingProducts.map(p => `
        <div class="product-card" id="card-${p.id}">
          <div class="p-cover">
            ${p.cover_url ? `<img src="${escapeHtml(p.cover_url)}" alt="">` : ''}
          </div>
          <div class="p-title">${escapeHtml(p.title)}</div>
          <div class="p-seller">by ${escapeHtml(p.seller_name || 'Unknown')}</div>
          <div class="p-desc">${escapeHtml(p.description || '')}</div>
          <div class="p-meta-row">
            <span class="p-cat">${escapeHtml(p.category || '')}</span>
            <span class="p-price">${money(p.price, p.currency)}</span>
          </div>
          <div class="p-links">
            📄 <a href="${escapeHtml(p.file_url)}" target="_blank">View product file</a>
          </div>
          <div class="action-row">
            <button class="btn btn-approve" onclick="reviewProduct('${p.id}', 'published')">✓ Approve</button>
            <button class="btn btn-reject" onclick="reviewProduct('${p.id}', 'rejected')">✕ Reject</button>
          </div>
        </div>
      `).join('');
  }

  async function reviewProduct(id, newStatus) {
    const card = document.getElementById(`card-${id}`);
    const buttons = card.querySelectorAll('button');
    buttons.forEach(b => b.disabled = true);

    try {
      const res = await fetch(`${API_BASE}/products/${id}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ status: newStatus })
      });

      if (!res.ok) {
        alert('Could not update this product. Please try again.');
        buttons.forEach(b => b.disabled = false);
        return;
      }

      pendingProducts = pendingProducts.filter(p => p.id !== id);
      render();

    } catch (err) {
      alert('Connection error. Please try again.');
      buttons.forEach(b => b.disabled = false);
    }
  }

  load();
</script>

</body>
</html>
