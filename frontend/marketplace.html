<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace | AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050b">
<style>
  :root {
    --bg: #05050b; --card-bg: #0f0f1a; --border: #1c1c2e;
    --gold: #ffd21a; --blue: #4e7cff; --violet: #7b45ff;
    --text-light: #f8f8fc; --text-muted: #8992a7; --input-bg: #0a0a12;
    --success: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text-light);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh; padding-bottom: 40px;
  }
  .top-header {
    display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 16px;
    position: sticky; top: 0; background: rgba(5,5,11,.9); backdrop-filter: blur(12px);
    z-index: 50; border-bottom: 1px solid var(--border);
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .back-btn {
    font-size: 18px; color: var(--text-light); text-decoration: none;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 9px;
  }
  .header-title { font-size: 15px; font-weight: 700; }
  .post-btn {
    background: var(--gold); color: #07070a; border: none; border-radius: 10px;
    padding: 9px 14px; font-size: 12.5px; font-weight: 800; text-decoration: none;
  }

  .wrap { max-width: 460px; margin: 0 auto; padding: 18px; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }

  .earn-banner {
    background: rgba(255,210,26,.08); border: 1px solid rgba(255,210,26,.25); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 20px; font-size: 12.5px; color: #d9c98a; line-height: 1.6;
  }
  .earn-banner strong { color: var(--gold); }

  .course-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; margin-bottom: 14px; text-decoration: none; color: var(--text-light); display: block;
  }
  .course-cover { width: 100%; height: 140px; background: var(--input-bg); overflow: hidden; }
  .course-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .course-body { padding: 14px; }
  .course-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
  .course-desc {
    font-size: 12.5px; color: var(--text-muted); line-height: 1.5; margin-bottom: 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .course-bottom { display: flex; justify-content: space-between; align-items: center; }
  .course-price { font-size: 15px; font-weight: 800; color: var(--gold); }
  .course-cta { font-size: 11.5px; font-weight: 800; color: var(--blue); }

  .empty-state { text-align: center; padding: 70px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 40px; margin-bottom: 14px; opacity: .5; }
  .empty-state p { font-size: 13.5px; line-height: 1.6; }

  .loading-text { text-align: center; color: var(--text-muted); padding: 50px; font-size: 13px; }
  .retry-btn { margin-top: 16px; padding: 11px 24px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-light); font-weight: 700; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>

<div class="top-header">
  <div class="header-left">
    <a href="dashboard.html" class="back-btn">←</a>
    <div class="header-title">Marketplace</div>
  </div>
  <a href="add-product.html" class="post-btn" id="postBtn" style="display:none;">+ Add Course</a>
</div>

<div class="wrap">
  <div class="subtitle">Real courses, built to help you grow.</div>

  <div class="earn-banner">
    💡 <strong>Anyone can promote these courses.</strong> Open a course, tap "Get My Link," and earn 50% commission on every sale made through your link.
  </div>

  <div id="mainContent">
    <div class="loading-text">Loading courses...</div>
  </div>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const role = localStorage.getItem('af_role');

  if (role === 'admin') {
    document.getElementById('postBtn').style.display = 'inline-flex';
  }

  const CURRENCY_SYMBOLS = { USD: '$', GHS: '₵', GBP: '£', EUR: '€' };
  function money(amount, currency) {
    const symbol = CURRENCY_SYMBOLS[currency] || '₵';
    return `${symbol}${Number(amount || 0).toFixed(2)}`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function loadCourses() {
    try {
      const res = await fetch(`${API_BASE}/products`);

      if (!res.ok) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <p>Couldn't load the marketplace right now.</p>
            <button class="retry-btn" onclick="loadCourses()">Try Again</button>
          </div>`;
        return;
      }

      const data = await res.json();
      const courses = (data.products || []).filter(
        p => (p.category || '').toLowerCase() === 'courses'
      );

      if (courses.length === 0) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="icon">🎓</div>
            <p>No courses listed yet.<br>Check back soon.</p>
          </div>`;
        return;
      }

      document.getElementById('mainContent').innerHTML = courses.map(c => `
        <a href="product-details.html?id=${c.id}" class="course-card">
          <div class="course-cover">
            ${c.cover_url ? `<img src="${escapeHtml(c.cover_url)}" alt="${escapeHtml(c.title)}" loading="lazy">` : ''}
          </div>
          <div class="course-body">
            <div class="course-title">${escapeHtml(c.title)}</div>
            <div class="course-desc">${escapeHtml(c.subtitle || c.description || '')}</div>
            <div class="course-bottom">
              <span class="course-price">${money(c.price, c.currency)}</span>
              <span class="course-cta">View & Promote →</span>
            </div>
          </div>
        </a>
      `).join('');

    } catch (err) {
      document.getElementById('mainContent').innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <p>Connection error. Please try again.</p>
          <button class="retry-btn" onclick="loadCourses()">Try Again</button>
        </div>`;
    }
  }

  loadCourses();
</script>

</body>
</html>
