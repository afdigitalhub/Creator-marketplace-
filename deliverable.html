<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Deliverable | AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<style>
  :root {
    --bg: #05050a; --card-bg: #0f0f1a; --border: #1c1c2e;
    --accent-blue: #4f6ef7; --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc; --text-muted: #6b6b80; --input-bg: #0a0a12;
    --success: #34d399; --error: #f87171; --pending: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }
  .top-header { display: flex; align-items: center; gap: 14px; padding: 18px 16px; position: sticky; top: 0; background: rgba(5,5,10,0.9); backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid var(--border); }
  .back-btn { font-size: 20px; color: var(--text-light); text-decoration: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 10px; }
  .header-title { font-size: 16px; font-weight: 700; }
  .main-content { padding: 20px 16px; max-width: 480px; margin: 0 auto; }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  select, input, textarea { width: 100%; padding: 13px 15px; background: var(--input-bg); border: 1.5px solid var(--border); border-radius: 13px; color: var(--text-light); font-size: 14.5px; outline: none; font-family: inherit; }
  select:focus, input:focus, textarea:focus { border-color: var(--accent-blue); }
  textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
  .submit-btn { width: 100%; padding: 15px; border: none; border-radius: 14px; background: var(--gradient); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 6px; }
  .submit-btn:disabled { opacity: 0.6; }
  .msg-box { padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 18px; display: none; line-height: 1.4; }
  .msg-box.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--error); }
  .msg-box.success { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); color: var(--success); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; line-height: 1.5; }
  .loading-text { text-align: center; color: var(--text-muted); padding: 40px; font-size: 14px; }
  .past-title { font-size: 13px; font-weight: 700; margin: 30px 0 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .deliverable-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .deliverable-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .deliverable-campaign { font-size: 13.5px; font-weight: 700; }
  .status-pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .status-pill.approved { background: rgba(52,211,153,0.12); color: var(--success); }
  .status-pill.pending { background: rgba(251,191,36,0.12); color: var(--pending); }
  .deliverable-link { font-size: 12.5px; color: var(--accent-blue); word-break: break-all; margin-top: 4px; display: block; }
  .deliverable-notes { font-size: 13px; color: var(--text-muted); margin-top: 6px; line-height: 1.45; }
</style>
</head>
<body>

<div class="top-header">
  <a href="dashboard.html" class="back-btn">←</a>
  <div class="header-title">Submit Deliverable</div>
</div>

<div class="main-content" id="mainContent">
  <div class="loading-text">Loading your accepted campaigns...</div>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');
  const role = localStorage.getItem('af_role');

  if (!token) {
    localStorage.setItem('af_redirect_after_login', window.location.href);
    window.location.href = 'login.html';
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;');
  }

  function showMsg(text, isError) {
    const box = document.getElementById('msgBox');
    if (!box) return;
    box.textContent = text;
    box.className = 'msg-box ' + (isError ? 'error' : 'success');
    box.style.display = 'block';
  }

  function renderEmpty(message) {
    document.getElementById('mainContent').innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
  }

  function renderForm(acceptedApps, pastDeliverables) {
    let html = `<div class="msg-box" id="msgBox"></div>`;

    html += `
      <div class="field">
        <label>Campaign</label>
        <select id="campaignSelect">
          ${acceptedApps.map(a => `<option value="${escapeAttr(a.campaign_id)}">${escapeHtml(a.campaign_title || 'Campaign')}</option>`).join('')}
        </select>
      </div>

      <div class="field">
        <label>Submission Link</label>
        <input type="url" id="submissionUrl" placeholder="https://...">
      </div>

      <div class="field">
        <label>Notes (optional)</label>
        <textarea id="notes" placeholder="Anything the business should know about this submission."></textarea>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitDeliverable()">Submit Deliverable</button>
    `;

    if (pastDeliverables.length > 0) {
      html += `<div class="past-title">Your Submissions</div>`;
      html += pastDeliverables.map(d => `
        <div class="deliverable-card">
          <div class="deliverable-top">
            <div class="deliverable-campaign">${escapeHtml(d.campaign_title || 'Campaign')}</div>
            <div class="status-pill ${d.approved ? 'approved' : 'pending'}">${d.approved ? 'Approved' : 'Pending'}</div>
          </div>
          <a href="${escapeAttr(d.submission_url)}" target="_blank" rel="noopener noreferrer" class="deliverable-link">${escapeHtml(d.submission_url)}</a>
          ${d.notes ? `<div class="deliverable-notes">${escapeHtml(d.notes)}</div>` : ''}
        </div>
      `).join('');
    }

    document.getElementById('mainContent').innerHTML = html;
  }

  async function init() {
    if (role !== 'creator') {
      renderEmpty('Only creators can submit deliverables.');
      return;
    }

    try {
      const [appsRes, delRes] = await Promise.all([
        fetch(`${API_BASE}/applications/mine`, { headers: { 'Authorization': `Bearer ${token}` } }),
        fetch(`${API_BASE}/deliverables/mine`, { headers: { 'Authorization': `Bearer ${token}` } })
      ]);

      if (!appsRes.ok) {
        renderEmpty('Could not load your applications. Please try again.');
        return;
      }

      const appsData = await appsRes.json();
      const acceptedApps = (appsData.applications || []).filter(a => a.status === 'accepted');

      let pastDeliverables = [];
      if (delRes.ok) {
        const delData = await delRes.json();
        pastDeliverables = delData.deliverables || [];
      }

      if (acceptedApps.length === 0) {
        renderEmpty("You don't have any accepted campaigns yet. Once a business accepts your application, you can submit your work here.");
        return;
      }

      renderForm(acceptedApps, pastDeliverables);

    } catch (err) {
      renderEmpty('Connection error. Please check your connection and try again.');
    }
  }

  async function submitDeliverable() {
    const btn = document.getElementById('submitBtn');
    const campaign_id = document.getElementById('campaignSelect').value;
    const submission_url = document.getElementById('submissionUrl').value.trim();
    const notes = document.getElementById('notes').value.trim();

    if (!submission_url) {
      showMsg('Please add a submission link.', true);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
      const res = await fetch(`${API_BASE}/deliverables`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ campaign_id, submission_url, notes: notes || null })
      });

      const data = await res.json();

      if (!res.ok) {
        showMsg(data.error || 'Could not submit deliverable.', true);
        btn.disabled = false;
        btn.textContent = 'Submit Deliverable';
        return;
      }

      showMsg('Deliverable submitted.', false);
      document.getElementById('submissionUrl').value = '';
      document.getElementById('notes').value = '';
      btn.disabled = false;
      btn.textContent = 'Submit Deliverable';

      init();

    } catch (err) {
      showMsg('Connection error. Please try again.', true);
      btn.disabled = false;
      btn.textContent = 'Submit Deliverable';
    }
  }

  init();
</script>

</body>
  </html>
