<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<style>
  :root {
    --bg: #05050a; --card-bg: #0f0f1a; --border: #1c1c2e;
    --accent-blue: #4f6ef7; --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc; --text-muted: #6b6b80; --input-bg: #0a0a12;
    --af-yellow: #f5c518; --success: #34d399; --error: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }

  .top-header { display: flex; align-items: center; gap: 14px; padding: 18px 16px; position: sticky; top: 0; background: rgba(5,5,10,0.9); backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid var(--border); }
  .back-btn { font-size: 20px; color: var(--text-light); text-decoration: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 10px; }
  .header-title { font-size: 16px; font-weight: 700; }

  .main-content { padding: 20px 16px; max-width: 560px; margin: 0 auto; }
  .intro { margin-bottom: 20px; }
  .intro h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .intro p { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

  .order-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 15px; margin-bottom: 12px; }
  .order-main { display: flex; gap: 14px; margin-bottom: 12px; }
  .order-cover { width: 56px; height: 74px; border-radius: 9px; background: var(--input-bg); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .order-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .order-info { flex: 1; min-width: 0; }
  .order-title { font-size: 14.5px; font-weight: 700; margin-bottom: 3px; }
  .order-seller { font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; }
  .order-amount { font-size: 15px; font-weight: 800; color: var(--accent-blue); }

  .status-pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; margin-bottom: 8px; }
  .status-paid { background: rgba(52,211,153,0.12); color: var(--success); }
  .status-pending { background: rgba(245,197,24,0.12); color: var(--af-yellow); }
  .status-failed { background: rgba(248,113,113,0.12); color: var(--error); }
  .status-refunded { background: rgba(107,107,128,0.15); color: var(--text-muted); }
  .status-cancelled { background: rgba(107,107,128,0.15); color: var(--text-muted); }

  .detail-box { background: var(--input-bg); border: 1px solid var(--border); border-radius: 11px; padding: 11px 13px; margin-bottom: 12px; }
  .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 12.5px; }
  .detail-label { color: var(--text-muted); }
  .detail-value { font-weight: 600; text-align: right; word-break: break-all; }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; }
  .btn-primary { background: var(--gradient); color: white; }
  .btn-secondary { background: var(--input-bg); border: 1px solid var(--border); color: var(--text-light); }

  .empty-state { text-align: center; padding: 70px 24px; }
  .empty-state .icon { font-size: 40px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state h2 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .empty-state p { font-size: 13.5px; color: var(--text-muted); line-height: 1.55; margin-bottom: 22px; }
  .empty-state a { display: inline-block; padding: 12px 26px; border-radius: 12px; background: var(--gradient); color: white; text-decoration: none; font-weight: 700; font-size: 14px; }

  .loading-text { text-align: center; color: var(--text-muted); padding: 50px; font-size: 14px; }
  .retry-btn { margin-top: 16px; padding: 11px 24px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-light); font-weight: 700; font-size: 13.5px; cursor: pointer; }

  .info-box { background: var(--input-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; font-size: 12.5px; color: var(--text-muted); line-height: 1.6; margin-top: 18px; }
  .info-box a { color: var(--accent-blue); text-decoration: none; }
</style>
</head>
<body>

<div class="top-header">
  <a href="dashboard.html" class="back-btn">←</a>
  <div class="header-title">My Orders</div>
</div>

<div class="main-content" id="mainContent">
  <div class="loading-text">Loading your orders...</div>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');

  if (!token) {
    localStorage.setItem('af_redirect_after_login', window.location.href);
    window.location.href = 'login.html';
  }

  const CURRENCY_SYMBOLS = { USD: '$', GHS: '₵', NGN: '₦', GBP: '£', EUR: '€', KES: 'KSh', ZAR: 'R', CAD: '$' };
  function money(amount, currency) {
    const symbol = CURRENCY_SYMBOLS[currency] || '';
    return `${symbol}${Number(amount || 0).toFixed(2)}`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function statusInfo(status) {
    if (status === 'paid') return { label: 'Paid', cls: 'status-paid' };
    if (status === 'pending') return { label: 'Not completed', cls: 'status-pending' };
    if (status === 'failed') return { label: 'Payment failed', cls: 'status-failed' };
    if (status === 'refunded') return { label: 'Refunded', cls: 'status-refunded' };
    if (status === 'cancelled') return { label: 'Cancelled', cls: 'status-cancelled' };
    return { label: status, cls: 'status-pending' };
  }

  async function load() {
    try {
      const res = await fetch(`${API_BASE}/orders/mine`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (res.status === 401) {
        localStorage.setItem('af_redirect_after_login', window.location.href);
        window.location.href = 'login.html';
        return;
      }

      if (!res.ok) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <h2>Couldn't load your orders</h2>
            <p>Something went wrong on our side.</p>
            <button class="retry-btn" onclick="load()">Try Again</button>
          </div>`;
        return;
      }

      const data = await res.json();
      const orders = data.orders || [];

      if (orders.length === 0) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="icon">🧾</div>
            <h2>No orders yet</h2>
            <p>Anything you buy will show up here, with the amount paid and when.</p>
            <a href="shop.html">Browse the Shop</a>
          </div>`;
        return;
      }

      document.getElementById('mainContent').innerHTML = `
        <div class="intro">
          <h1>My Orders</h1>
          <p>${orders.length} order${orders.length === 1 ? '' : 's'}.</p>
        </div>

        ${orders.map(o => {
          const s = statusInfo(o.status);
          return `
            <div class="order-card">
              <div class="status-pill ${s.cls}">${s.label}</div>

              <div class="order-main">
                <div class="order-cover">
                  ${o.cover_url ? `<img src="${escapeHtml(o.cover_url)}" alt="" onerror="this.remove()">` : ''}
                </div>
                <div class="order-info">
                  <div class="order-title">${escapeHtml(o.product_title)}</div>
                  ${o.seller_name ? `<div class="order-seller">Sold by ${escapeHtml(o.seller_name)}</div>` : ''}
                  <div class="order-amount">${money(o.gross_amount, o.currency)}</div>
                </div>
              </div>

              <div class="detail-box">
                <div class="detail-row">
                  <span class="detail-label">Ordered</span>
                  <span class="detail-value">${formatDate(o.created_at)}</span>
                </div>
                ${o.payment_reference ? `
                <div class="detail-row">
                  <span class="detail-label">Payment reference</span>
                  <span class="detail-value">${escapeHtml(o.payment_reference)}</span>
                </div>` : ''}
              </div>

              <div class="btn-row">
                ${o.has_access ? `<a href="library.html" class="btn btn-primary">Go to Library</a>` : ''}
                ${o.status === 'pending' ? `<a href="product-details.html?id=${o.product_id}" class="btn btn-primary">Complete Purchase</a>` : ''}
                ${o.status === 'failed' ? `<a href="product-details.html?id=${o.product_id}" class="btn btn-primary">Try Again</a>` : ''}
                <a href="product-details.html?id=${o.product_id}" class="btn btn-secondary">View Product</a>
              </div>
            </div>`;
        }).join('')}

        <div class="info-box">
          Need help with an order? See our <a href="refunds.html">refund policy</a> or email
          <a href="mailto:hizroyalliltempo@gmail.com">hizroyalliltempo@gmail.com</a> with your payment reference.
        </div>
      `;

    } catch (err) {
      document.getElementById('mainContent').innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <h2>Connection problem</h2>
          <p>Please check your connection and try again.</p>
          <button class="retry-btn" onclick="load()">Try Again</button>
        </div>`;
    }
  }

  load();
</script>

</body>
  </html>
