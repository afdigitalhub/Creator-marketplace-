<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell a Product — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<style>
  :root {
    --bg: #05050a;
    --card-bg: #0f0f1a;
    --card-border: rgba(139, 92, 246, 0.15);
    --accent-blue: #4f6ef7;
    --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc;
    --text-muted: #6b6b80;
    --text-dim: #4a4a5e;
    --af-yellow: #f5c518;
    --input-bg: #0a0a12;
    --border: #1c1c2e;
    --success: #34d399;
    --error: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text-light);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
    -webkit-font-smoothing: antialiased;
  }

  .top-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 16px;
    position: sticky;
    top: 0;
    background: rgba(5, 5, 10, 0.9);
    backdrop-filter: blur(12px);
    z-index: 50;
    border-bottom: 1px solid var(--border);
  }

  .back-btn {
    font-size: 20px;
    color: var(--text-light);
    text-decoration: none;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card-bg);
    border-radius: 10px;
  }

  .header-title { font-size: 16px; font-weight: 700; }

  .main-content { padding: 20px 16px; max-width: 480px; margin: 0 auto; }

  .intro { margin-bottom: 22px; }
  .intro h2 { font-size: 21px; font-weight: 700; margin-bottom: 6px; }
  .intro p { color: var(--text-muted); font-size: 14px; line-height: 1.5; }

  .field { margin-bottom: 18px; }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  input, textarea, select {
    width: 100%;
    padding: 13px 15px;
    background: var(--input-bg);
    border: 1.5px solid var(--border);
    border-radius: 13px;
    color: var(--text-light);
    font-size: 14.5px;
    outline: none;
    font-family: inherit;
  }

  select {
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236b6b80' stroke-width='1.5' fill='none'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
  }

  input:focus, textarea:focus, select:focus { border-color: var(--accent-blue); }

  textarea { resize: vertical; min-height: 100px; line-height: 1.5; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

  .submit-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: var(--gradient);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }

  .submit-btn:disabled { opacity: 0.6; }

  .msg-box {
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 18px;
    display: none;
    line-height: 1.4;
  }

  .msg-box.error {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    color: var(--error);
  }

  .msg-box.success {
    background: rgba(52,211,153,0.1);
    border: 1px solid rgba(52,211,153,0.3);
    color: var(--success);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="top-header">
  <a href="dashboard.html" class="back-btn">←</a>
  <div class="header-title">Sell a Product</div>
</div>

<div class="main-content" id="mainContent">
  <div class="intro">
    <h2>List a new product</h2>
    <p>Add your eBook, guide, or template to the Shop.</p>
  </div>

  <div class="msg-box" id="msgBox"></div>

  <div class="field">
    <label for="title">Product Title</label>
    <input type="text" id="title" placeholder="e.g. Start Where You Are">
  </div>

  <div class="field">
    <label for="subtitle">Subtitle (optional)</label>
    <input type="text" id="subtitle" placeholder="e.g. A Practical Guide to Building a Business">
  </div>

  <div class="field">
    <label for="description">Description</label>
    <textarea id="description" placeholder="What is this product, and who is it for?"></textarea>
  </div>

  <div class="row2">
    <div class="field">
      <label for="category">Category</label>
      <select id="category">
        <option value="">Select</option>
        <option>eBook</option>
        <option>Study Guide</option>
        <option>Template</option>
        <option>Digital Tool</option>
        <option>Other</option>
      </select>
    </div>
    <div class="field">
      <label for="tags">Tags (optional)</label>
      <input type="text" id="tags" placeholder="business, startup">
    </div>
  </div>

  <div class="field">
    <label for="cover_url">Cover Image URL</label>
    <input type="url" id="cover_url" placeholder="https://...">
    <div class="hint">Paste a link to your product cover image.</div>
  </div>

  <div class="field">
    <label for="file_url">Product File URL</label>
    <input type="url" id="file_url" placeholder="https://...">
    <div class="hint">Link to the file customers will access after purchase (e.g. a download link).</div>
  </div>

  <div class="row2">
    <div class="field">
      <label for="price">Price</label>
      <input type="number" id="price" min="0" step="0.01" placeholder="e.g. 45">
    </div>
    <div class="field">
      <label for="currency">Currency</label>
      <select id="currency">
        <option value="GHS">GHS ₵</option>
        <option value="USD">USD $</option>
        <option value="NGN">NGN ₦</option>
        <option value="GBP">GBP £</option>
        <option value="EUR">EUR €</option>
        <option value="KES">KES KSh</option>
        <option value="ZAR">ZAR R</option>
        <option value="CAD">CAD $</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label for="status">Status</label>
    <select id="status">
      <option value="draft">Draft (not visible to customers)</option>
      <option value="published">Published (live in the Shop)</option>
    </select>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitProduct()">List Product</button>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');
  const role = localStorage.getItem('af_role');

  if (!token) window.location.href = 'login.html';

  if (role !== 'admin') {
    document.getElementById('mainContent').innerHTML = `<div class="empty-state">Only AF Digital Hub can list products right now.</div>`;
  }

  function showMsg(text, isError) {
    const box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg-box ' + (isError ? 'error' : 'success');
    box.style.display = 'block';
  }

  async function submitProduct() {
    const title = document.getElementById('title').value.trim();
    const subtitle = document.getElementById('subtitle').value.trim();
    const description = document.getElementById('description').value.trim();
    const category = document.getElementById('category').value;
    const tags = document.getElementById('tags').value.trim();
    const cover_url = document.getElementById('cover_url').value.trim();
    const file_url = document.getElementById('file_url').value.trim();
    const price = document.getElementById('price').value;
    const currency = document.getElementById('currency').value;
    const status = document.getElementById('status').value;

    if (!title || !description || !category || !price) {
      showMsg('Please fill in Title, Description, Category, and Price.', true);
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Listing...';

    try {
      const res = await fetch(`${API_BASE}/products`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({
          title, subtitle, description, category, tags,
          cover_url, file_url,
          price: Number(price), currency, status
        })
      });

      const data = await res.json();

      if (!res.ok) {
        showMsg((data.error || 'Could not list product.') + (data.detail ? ' — ' + data.detail : ''), true);
        btn.disabled = false;
        btn.textContent = 'List Product';
        return;
      }

      showMsg('Product listed successfully!', false);
      document.getElementById('title').value = '';
      document.getElementById('subtitle').value = '';
      document.getElementById('description').value = '';
      document.getElementById('tags').value = '';
      document.getElementById('cover_url').value = '';
      document.getElementById('file_url').value = '';
      document.getElementById('price').value = '';
      btn.disabled = false;
      btn.textContent = 'List Product';

    } catch (err) {
      showMsg('Connection error. Please try again.', true);
      btn.disabled = false;
      btn.textContent = 'List Product';
    }
  }
</script>

</body>
</html>
