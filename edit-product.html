<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Product — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<style>
  :root {
    --bg: #05050a; --card-bg: #0f0f1a; --border: #1c1c2e;
    --accent-blue: #4f6ef7; --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc; --text-muted: #6b6b80; --input-bg: #0a0a12;
    --success: #34d399; --error: #f87171; --af-yellow: #f5c518;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }
  .top-header { display: flex; align-items: center; gap: 14px; padding: 18px 16px; position: sticky; top: 0; background: rgba(5,5,10,0.9); backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid var(--border); }
  .back-btn { font-size: 20px; color: var(--text-light); text-decoration: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 10px; }
  .header-title { font-size: 16px; font-weight: 700; }
  .main-content { padding: 20px 16px; max-width: 480px; margin: 0 auto; }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  input, textarea, select {
    width: 100%; padding: 13px 15px; background: var(--input-bg); border: 1.5px solid var(--border);
    border-radius: 13px; color: var(--text-light); font-size: 14.5px; outline: none; font-family: inherit;
  }
  select {
    -webkit-appearance: none; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236b6b80' stroke-width='1.5' fill='none'/></svg>");
    background-repeat: no-repeat; background-position: right 14px center;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent-blue); }
  textarea { resize: vertical; min-height: 100px; line-height: 1.5; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .submit-btn { width: 100%; padding: 15px; border: none; border-radius: 14px; background: var(--gradient); color: white; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  .submit-btn:disabled { opacity: 0.6; }
  .msg-box { padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 18px; display: none; line-height: 1.4; }
  .msg-box.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--error); }
  .msg-box.success { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); color: var(--success); }
  .loading-text { text-align: center; color: var(--text-muted); padding: 40px; font-size: 14px; }
  .toggle-field { display: flex; align-items: center; justify-content: space-between; padding: 14px 15px; background: var(--input-bg); border: 1.5px solid var(--border); border-radius: 13px; margin-bottom: 18px; }
  .toggle-label { font-size: 14px; font-weight: 600; color: var(--text-light); }
  .toggle-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: var(--border); border-radius: 26px; transition: 0.2s; }
  .slider::before { content: ""; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s; }
  input:checked + .slider { background: var(--gradient); }
  input:checked + .slider::before { transform: translateX(20px); }
</style>
</head>
<body>

<div class="top-header">
  <a href="manage-products.html" class="back-btn">←</a>
  <div class="header-title">Edit Product</div>
</div>

<div class="main-content" id="mainContent">
  <div class="loading-text">Loading product...</div>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');
  const params = new URLSearchParams(window.location.search);
  const productId = params.get('id');

  if (!token) window.location.href = 'login.html';

  function renderForm(p) {
    document.getElementById('mainContent').innerHTML = `
      <div class="msg-box" id="msgBox"></div>

      <div class="field">
        <label>Product Title</label>
        <input type="text" id="title" value="${escapeAttr(p.title)}">
      </div>

      <div class="field">
        <label>Subtitle</label>
        <input type="text" id="subtitle" value="${escapeAttr(p.subtitle || '')}">
      </div>

      <div class="field">
        <label>Description</label>
        <textarea id="description">${escapeHtml(p.description)}</textarea>
      </div>

      <div class="row2">
        <div class="field">
          <label>Category</label>
          <select id="category">
            ${['eBook','Study Guide','Template','Digital Tool','Other'].map(c =>
              `<option ${p.category === c ? 'selected' : ''}>${c}</option>`
            ).join('')}
          </select>
        </div>
        <div class="field">
          <label>Tags</label>
          <input type="text" id="tags" value="${escapeAttr(p.tags || '')}">
        </div>
      </div>

      <div class="field">
        <label>Cover Image URL</label>
        <input type="url" id="cover_url" value="${escapeAttr(p.cover_url || '')}">
      </div>

      <div class="field">
        <label>Product File URL</label>
        <input type="url" id="file_url" value="${escapeAttr(p.file_url || '')}">
      </div>

      <div class="row2">
        <div class="field">
          <label>Price</label>
          <input type="number" id="price" min="0" step="0.01" value="${p.price}">
        </div>
        <div class="field">
          <label>Currency</label>
          <select id="currency">
            ${['GHS','USD','NGN','GBP','EUR','KES','ZAR','CAD'].map(c =>
              `<option value="${c}" ${p.currency === c ? 'selected' : ''}>${c}</option>`
            ).join('')}
          </select>
        </div>
      </div>

      <div class="field">
        <label>Status</label>
        <select id="status">
          <option value="draft" ${p.status === 'draft' ? 'selected' : ''}>Draft (not visible to customers)</option>
          <option value="published" ${p.status === 'published' ? 'selected' : ''}>Published (live in the Shop)</option>
          <option value="unpublished" ${p.status === 'unpublished' ? 'selected' : ''}>Unpublished</option>
        </select>
      </div>

      <div class="toggle-field">
        <div>
          <div class="toggle-label">Featured in Shop</div>
          <div class="toggle-sub">Shows in the Featured section</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="is_featured" ${p.is_featured ? 'checked' : ''}>
          <span class="slider"></span>
        </label>
      </div>

      <button class="submit-btn" id="saveBtn" onclick="saveProduct()">Save Changes</button>
    `;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;');
  }

  function showMsg(text, isError) {
    const box = document.getElementById('msgBox');
    if (!box) return;
    box.textContent = text;
    box.className = 'msg-box ' + (isError ? 'error' : 'success');
    box.style.display = 'block';
  }

  async function loadProduct() {
    try {
      const res = await fetch(`${API_BASE}/products/${productId}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();

      if (!res.ok) {
        document.getElementById('mainContent').innerHTML = `<div class="loading-text">Product not found.</div>`;
        return;
      }

      renderForm(data.product);
    } catch (err) {
      document.getElementById('mainContent').innerHTML = `<div class="loading-text">Connection error. Please try again.</div>`;
    }
  }

  async function saveProduct() {
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const body = {
      title: document.getElementById('title').value.trim(),
      subtitle: document.getElementById('subtitle').value.trim(),
      description: document.getElementById('description').value.trim(),
      category: document.getElementById('category').value,
      tags: document.getElementById('tags').value.trim(),
      cover_url: document.getElementById('cover_url').value.trim(),
      file_url: document.getElementById('file_url').value.trim(),
      price: Number(document.getElementById('price').value),
      currency: document.getElementById('currency').value,
      status: document.getElementById('status').value,
      is_featured: document.getElementById('is_featured').checked
    };

    try {
      const res = await fetch(`${API_BASE}/products/${productId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(body)
      });

      const data = await res.json();

      if (!res.ok) {
        showMsg((data.error || 'Could not save.') + (data.detail ? ' — ' + data.detail : ''), true);
        btn.disabled = false;
        btn.textContent = 'Save Changes';
        return;
      }

      showMsg('Product updated!', false);
      btn.disabled = false;
      btn.textContent = 'Save Changes';

    } catch (err) {
      showMsg('Connection error. Please try again.', true);
      btn.disabled = false;
      btn.textContent = 'Save Changes';
    }
  }

  loadProduct();
</script>

</body>
  </html>
