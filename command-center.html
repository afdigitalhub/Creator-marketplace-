<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center — AF Digital Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<style>
  :root {
    --bg: #05050a; --card-bg: #0f0f1a; --border: #1c1c2e;
    --accent-blue: #4f6ef7; --gradient: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 60%, #6d28d9 100%);
    --text-light: #f8f8fc; --text-muted: #6b6b80; --input-bg: #0a0a12;
    --af-yellow: #f5c518; --success: #34d399; --error: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text-light); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }

  .top-header { display: flex; align-items: center; gap: 14px; padding: 18px 16px; position: sticky; top: 0; background: rgba(5,5,10,0.9); backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid var(--border); }
  .back-btn { font-size: 20px; color: var(--text-light); text-decoration: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 10px; }
  .header-title { font-size: 16px; font-weight: 700; }

  .main-content { padding: 20px 16px; max-width: 620px; margin: 0 auto; }

  .hero-card { background: linear-gradient(135deg, rgba(79,110,247,0.14), rgba(124,58,237,0.14)); border: 1px solid rgba(139,92,246,0.2); border-radius: 20px; padding: 24px; margin-bottom: 20px; text-align: center; }
  .hero-label { font-size: 12.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .hero-value { font-size: 34px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
  .hero-note { font-size: 12.5px; color: var(--text-muted); }

  .section { margin-bottom: 26px; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 15px; }
  .stat-label { font-size: 11.5px; color: var(--text-muted); margin-bottom: 5px; line-height: 1.3; }
  .stat-value { font-size: 19px; font-weight: 800; }
  .stat-value.small { font-size: 16px; }
  .stat-value.good { color: var(--success); }
  .stat-value.warn { color: var(--af-yellow); }
  .stat-value.bad { color: var(--error); }

  .row-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 9px; }
  .row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .row-title { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
  .row-sub { font-size: 12px; color: var(--text-muted); }
  .row-value { font-size: 14.5px; font-weight: 800; color: var(--accent-blue); white-space: nowrap; }

  .alert-card { background: rgba(245,197,24,0.08); border: 1px solid rgba(245,197,24,0.25); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; }
  .alert-card a { color: var(--af-yellow); text-decoration: none; font-weight: 700; font-size: 13.5px; }
  .alert-card p { font-size: 13px; color: var(--af-yellow); line-height: 1.5; margin-bottom: 6px; }

  .empty-note { color: var(--text-muted); font-size: 13px; padding: 14px 0; line-height: 1.5; }
  .loading-text { text-align: center; color: var(--text-muted); padding: 50px; font-size: 14px; }
  .retry-btn { margin-top: 16px; padding: 11px 24px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-light); font-weight: 700; font-size: 13.5px; cursor: pointer; }

  .info-box { background: var(--input-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; font-size: 12.5px; color: var(--text-muted); line-height: 1.6; margin-top: 8px; }
</style>
</head>
<body>

<div class="top-header">
  <a href="admin.html" class="back-btn">←</a>
  <div class="header-title">Command Center</div>
</div>

<div class="main-content" id="mainContent">
  <div class="loading-text">Loading platform figures...</div>
</div>

<script>
  const API_BASE = "https://creator-marketplace-71rb.onrender.com";
  const token = localStorage.getItem('af_token');
  const role = localStorage.getItem('af_role');

  if (!token) {
    localStorage.setItem('af_redirect_after_login', window.location.href);
    window.location.href = 'login.html';
  }

  const CURRENCY_SYMBOLS = { USD: '$', GHS: '₵', NGN: '₦', GBP: '£', EUR: '€', KES: 'KSh', ZAR: 'R', CAD: '$' };
  function money(amount, currency) {
    const symbol = CURRENCY_SYMBOLS[currency] || '₵';
    return `${symbol}${Number(amount || 0).toFixed(2)}`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  async function load() {
    if (role !== 'admin') {
      document.getElementById('mainContent').innerHTML = `<div class="empty-note" style="text-align:center;">This page is for administrators only.</div>`;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/admin-stats`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!res.ok) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-note" style="text-align:center;">
            Couldn't load the figures.<br>
            <button class="retry-btn" onclick="load()">Try Again</button>
          </div>`;
        return;
      }

      const d = await res.json();
      const cur = d.money.currency || 'GHS';
      const m = d.money;
      const e = d.earnings;
      const w = d.withdrawals;
      const p = d.people;
      const pr = d.products;
      const mk = d.marketplace;
      const obs = d.orders_by_status || {};

      const awaitingCount = Number(w.awaiting);
      const openReports = Number(mk.open_reports);

      let html = '';

      // Anything needing attention goes first
      if (awaitingCount > 0 || openReports > 0) {
        html += `<div class="alert-card">`;
        if (awaitingCount > 0) {
          html += `<p>${awaitingCount} withdrawal${awaitingCount === 1 ? '' : 's'} awaiting your review (${money(w.awaiting_amount, cur)})</p>
                   <a href="admin-withdrawals.html">Review withdrawals →</a>`;
        }
        if (openReports > 0) {
          html += `<p style="margin-top:${awaitingCount > 0 ? '10px' : '0'};">${openReports} open report${openReports === 1 ? '' : 's'}</p>
                   <a href="admin.html">View reports →</a>`;
        }
        html += `</div>`;
      }

      html += `
        <div class="hero-card">
          <div class="hero-label">Your commission earned</div>
          <div class="hero-value">${money(m.platform_commission, cur)}</div>
          <div class="hero-note">From ${m.paid_orders} paid order${Number(m.paid_orders) === 1 ? '' : 's'}</div>
        </div>

        <div class="section">
          <div class="section-title">Money</div>
          <div class="grid">
            <div class="stat-card">
              <div class="stat-label">Total sales value</div>
              <div class="stat-value">${money(m.gross_revenue, cur)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Owed to sellers</div>
              <div class="stat-value">${money(m.seller_share, cur)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Cleared, ready to withdraw</div>
              <div class="stat-value small good">${money(e.available, cur)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Still clearing</div>
              <div class="stat-value small warn">${money(e.pending, cur)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Already paid out</div>
              <div class="stat-value small">${money(w.paid_out, cur)}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Withdrawals awaiting you</div>
              <div class="stat-value small ${awaitingCount > 0 ? 'warn' : ''}">${money(w.awaiting_amount, cur)}</div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Orders</div>
          <div class="grid">
            <div class="stat-card">
              <div class="stat-label">Paid</div>
              <div class="stat-value good">${obs.paid || 0}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Not completed</div>
              <div class="stat-value warn">${obs.pending || 0}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Failed</div>
              <div class="stat-value ${(obs.failed || 0) > 0 ? 'bad' : ''}">${obs.failed || 0}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Refunded</div>
              <div class="stat-value">${obs.refunded || 0}</div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">People</div>
          <div class="grid">
            <div class="stat-card">
              <div class="stat-label">Total users</div>
              <div class="stat-value">${p.total_users}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">New this month</div>
              <div class="stat-value">${p.new_this_month}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Creators</div>
              <div class="stat-value small">${p.creators}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Businesses</div>
              <div class="stat-value small">${p.businesses}</div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Shop</div>
          <div class="grid">
            <div class="stat-card">
              <div class="stat-label">Published products</div>
              <div class="stat-value">${pr.published}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Drafts</div>
              <div class="stat-value">${pr.drafts}</div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Marketplace</div>
          <div class="grid">
            <div class="stat-card">
              <div class="stat-label">Campaigns</div>
              <div class="stat-value small">${mk.campaigns}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Applications</div>
              <div class="stat-value small">${mk.applications}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Accepted</div>
              <div class="stat-value small">${mk.accepted}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Conversations</div>
              <div class="stat-value small">${mk.conversations}</div>
            </div>
          </div>
        </div>
      `;

      // Best sellers
      html += `<div class="section"><div class="section-title">Best selling</div>`;
      if (!d.top_products || d.top_products.length === 0) {
        html += `<div class="empty-note">No sales yet. This will fill in once products start selling.</div>`;
      } else {
        html += d.top_products.map(t => `
          <div class="row-card">
            <div class="row-top">
              <div>
                <div class="row-title">${escapeHtml(t.product_title)}</div>
                <div class="row-sub">${t.sales} sale${Number(t.sales) === 1 ? '' : 's'}</div>
              </div>
              <div class="row-value">${money(t.revenue, t.currency || cur)}</div>
            </div>
          </div>`).join('');
      }
      html += `</div>`;

      // Recent sales
      html += `<div class="section"><div class="section-title">Recent sales</div>`;
      if (!d.recent_orders || d.recent_orders.length === 0) {
        html += `<div class="empty-note">No sales yet.</div>`;
      } else {
        html += d.recent_orders.map(r => `
          <div class="row-card">
            <div class="row-top">
              <div>
                <div class="row-title">${escapeHtml(r.product_title)}</div>
                <div class="row-sub">${escapeHtml(r.buyer_name || 'A customer')} · ${formatDate(r.created_at)}</div>
              </div>
              <div class="row-value">${money(r.gross_amount, r.currency)}</div>
            </div>
          </div>`).join('');
      }
      html += `</div>`;

      html += `<div class="info-box">
        Every figure here comes from real records in the database. Nothing is estimated or projected.
      </div>`;

      document.getElementById('mainContent').innerHTML = html;

    } catch (err) {
      document.getElementById('mainContent').innerHTML = `
        <div class="empty-note" style="text-align:center;">
          Connection problem.<br>
          <button class="retry-btn" onclick="load()">Try Again</button>
        </div>`;
    }
  }

  load();
</script>

</body>
  </html>
